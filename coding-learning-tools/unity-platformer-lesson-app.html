<head>
<meta charset="utf-8">

<style>
/* Contrast vs --card: NIGHT tx 13.3 mu 6.9 cy 11.1 li 14.1 am 11.1 pk 4.9 (dark text) | DAY tx 17.9 mu 7.6 cy 5.4 li 5.0 am 5.0 pk 6.0 | CONTRAST tx 21 */
:root{--bg:#0B0F1A;--card:#151B2E;--bd:#2c3552;--cy:#00E5FF;--pk:#FF2E88;--onpk:#0B0F1A;--li:#B6FF3B;--am:#FFC83D;--mu:#9AA4BF;--tx:#DDE3F2;--hd:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-size:100%}
:root[data-theme=day]{--bg:#f8fafc;--card:#fff;--bd:#94a3b8;--cy:#0e7490;--pk:#be185d;--onpk:#fff;--li:#4d7c0f;--am:#b45309;--mu:#475569;--tx:#0f172a;--hd:#0f172a;color-scheme:light}
:root[data-theme=contrast]{--bg:#000;--card:#000;--bd:#ff0;--cy:#ff0;--pk:#f6c;--onpk:#000;--li:#0f6;--am:#ff0;--mu:#ff0;--tx:#fff;--hd:#fff;color-scheme:dark}
:root[data-theme=contrast] .panel,:root[data-theme=contrast] textarea,:root[data-theme=contrast] input[type=text],:root[data-theme=contrast] select,:root[data-theme=contrast] .dlg,:root[data-theme=contrast] .rc,:root[data-theme=contrast] pre,:root[data-theme=contrast] .task{border-width:2px}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4rem)}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.45 Calibri,Arial,sans-serif;transition:background-color .2s,color .2s}
p,span,h1,h2,h3,div,label,button,small,li{overflow-wrap:anywhere}
body.dys,body.dys *{font-family:"OpenDyslexic","Open Dyslexic","Comic Sans MS","Comic Neue",Verdana,sans-serif!important}
body.dys{letter-spacing:.03em;word-spacing:.08em;line-height:1.7}
:focus-visible{outline:3px solid var(--am)!important;outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--cy);color:var(--bg);padding:10px 16px;z-index:100;font-weight:700}
.skip:focus{left:8px;top:8px}
.a11y{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:2px solid var(--bd);padding:8px 14px}
.a11y-in{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.a11y-l{font-size:.75rem;letter-spacing:2px;font-weight:700;color:var(--mu);text-transform:uppercase}
.grp{display:flex;align-items:center;gap:4px;background:var(--bg);border:1.5px solid var(--bd);border-radius:8px;padding:3px}
.a11y button{background:transparent;color:var(--tx);border:1.5px solid transparent;padding:2px 10px;min-height:2rem;font-size:.8125rem}
.a11y button.on{background:var(--cy);color:var(--bg);border-color:var(--cy)}
.a11y .solo{background:var(--bg);border:1.5px solid var(--bd)}
#fsd{min-width:3.2em;text-align:center;font-size:.75rem;font-weight:700;color:var(--mu)}
header,main{max-width:1000px;margin:0 auto;padding:0 20px}header{padding-top:22px}main{padding-bottom:40px}main:focus{outline:none}
.tag{display:inline-block;background:var(--li);color:var(--bg);font-weight:700;letter-spacing:2px;font-size:.75rem;padding:4px 12px}
h1{font:700 1.875rem "Trebuchet MS",Arial,sans-serif;color:var(--hd);margin:10px 0 2px}.sub{color:var(--mu);font-style:italic;margin:0 0 10px}
button{font:700 .9375rem "Trebuchet MS",Arial,sans-serif;border:0;border-radius:6px;padding:9px 16px;min-height:2.75rem;cursor:pointer;background:var(--cy);color:var(--bg)}
button.alt{background:transparent;color:var(--cy);border:1.5px solid var(--cy)}button:hover:not(:disabled){filter:brightness(1.12)}
button:disabled{opacity:.5;cursor:not-allowed}
select{background:var(--card);color:var(--hd);border:1.5px solid var(--bd);border-radius:6px;padding:7px 9px;min-height:2.75rem;font:inherit;max-width:100%}
.tts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 6px;padding:8px 10px;background:var(--card);border:1.5px solid var(--bd);border-radius:8px}
.tts button{background:transparent;color:var(--cy);border:1.5px solid var(--cy)}.tts label{color:var(--mu);font-size:.875rem;font-weight:700}
[role=tablist]{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
[role=tab]{background:var(--card);color:var(--mu);border:1.5px solid var(--bd);display:flex;gap:8px;align-items:center;font-size:.8125rem}
[role=tab][aria-selected=true]{background:var(--cy);color:var(--bg);border-color:var(--cy)}
.panel{background:var(--card);border:1.5px solid var(--bd);border-left:6px solid var(--li);border-radius:10px;padding:16px 18px}.panel:focus{outline:none}
.panel h2{font:700 1.375rem "Trebuchet MS",Arial,sans-serif;color:var(--hd);margin:0 0 4px}
.panel h3{font:700 1rem "Trebuchet MS",Arial,sans-serif;color:var(--cy);margin:14px 0 4px}
label.f{display:block;font-weight:700;margin:12px 0 2px;color:var(--hd)}.hint{display:block;color:var(--mu);font-size:.875rem;margin-bottom:3px;font-weight:400}
textarea,input[type=text]{width:100%;background:var(--bg);color:var(--hd);border:1.5px solid var(--bd);border-radius:6px;padding:9px 11px;min-height:2.75rem;font:inherit}
textarea{min-height:4.5em;resize:vertical}
pre{background:var(--bg);color:var(--tx);border:1.5px solid var(--bd);border-radius:8px;padding:12px;margin:6px 0;overflow-x:auto;font:.8125rem/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
body.dys pre,body.dys pre *{font-family:ui-monospace,Menlo,Consolas,monospace!important;letter-spacing:0;word-spacing:0}
.cts{display:flex;gap:6px;flex-wrap:wrap}.cts button{min-height:2.5rem;padding:6px 12px;font-size:.8125rem}.cts button[aria-pressed=true]{background:var(--cy);color:var(--bg)}
.task{border:1.5px dashed var(--am);border-radius:8px;padding:8px 14px 10px;margin:14px 0 4px}.task b{color:var(--am)}
.task label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;min-height:2.75rem;cursor:pointer}.task input{width:1.4rem;height:1.4rem;flex:0 0 auto;margin-top:.1rem}
.panel :not(pre)>code{background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:0 4px;font-size:.9em}
/* Prism token colours follow the lesson's accessibility themes. */
.panel pre>code{font:inherit}
.panel pre .token:is(.comment,.prolog,.doctype){color:var(--mu)}
.panel pre .token:is(.keyword,.directive,.operator){color:var(--cy)}
.panel pre .token:is(.string,.char){color:var(--li)}
.panel pre .token:is(.number,.boolean,.constant,.class-name,.function){color:var(--am)}
:root[data-theme=contrast] .panel pre .token{font-weight:700}
@media print{.panel pre .token{color:#000!important}}

.ig{display:flex;align-items:flex-start;gap:10px}
.ig>textarea,.ig>input{flex:1 1 auto;width:auto;min-width:0}.ig>textarea{max-height:12rem}
.ig>.mic{margin:0;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 12px;font-size:.8125rem;min-height:2.75rem;max-height:3.5rem;border-radius:6px}
.ref{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.rc{--c:var(--cy);background:var(--bg);border:1.5px solid var(--c);border-radius:8px;padding:2px 14px 14px}.rc.sw{--c:var(--pk)}.rc.nw{--c:var(--li)}
.rc label.f{color:var(--c);font:700 1.125rem "Trebuchet MS",Arial,sans-serif;margin-top:12px}.rc .hint{font:400 .875rem Calibri,Arial,sans-serif;color:var(--mu)}
.cite{margin:12px 0 0;font-size:.8125rem}
.sel{margin:2px 0 8px}.sel label{display:block;font-size:.875rem;font-weight:700;color:var(--mu);margin-bottom:2px}.sel select{width:100%}
.rc select{border-color:var(--c)}
.mic[aria-pressed=true]{background:var(--pk);color:var(--onpk);border-color:var(--pk)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pnav{justify-content:space-between;margin-top:18px}.pnav button{flex:1 1 10rem}
#live{min-height:1.5em;color:var(--li);font-weight:700;margin-top:10px}
i[data-fb]::before{content:attr(data-fb);font-style:normal;font-family:inherit}.svg-inline--fa,i[data-fb]{margin-right:.3em}
@media (max-width:600px){.a11y{padding:8px}.a11y-in{flex-wrap:nowrap;gap:4px;overflow-x:auto}.a11y-l,.a11y-text{display:none}.a11y .grp,.a11y .solo{flex-shrink:0}.a11y .grp{gap:2px;padding:2px}.a11y button{min-width:2rem;padding:2px 6px}.a11y .svg-inline--fa,.a11y i[data-fb]{margin-right:0}#fsd{min-width:3em}}
.footer-menu{flex-wrap:nowrap}.footer-menu button{min-width:2.75rem;padding:9px 12px}.footer-menu .svg-inline--fa,.footer-menu i[data-fb]{margin-right:0}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}.ov[hidden]{display:none}
.dlg{background:var(--card);color:var(--tx);border:2px solid var(--bd);border-top:6px solid var(--li);border-radius:12px;width:100%;max-width:480px;max-height:100%;overflow:auto;padding:18px}
.dlg h2{font:700 1.375rem "Trebuchet MS",Arial,sans-serif;color:var(--hd);margin:0 0 4px}.dlg h3{font:700 1rem "Trebuchet MS",Arial,sans-serif;color:var(--cy);margin:14px 0 6px}.dlg .hint{margin:0 0 12px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:0 0 8px;padding:10px 14px}.opt small{display:block;font-weight:400;color:var(--mu);font-size:.8125rem}.dlg .close{margin-top:6px;width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{.a11y,.skip,.tts,#tabs,.row,.mic,#dh,#live,button,.pnav,.sel{display:none!important}body{background:#fff;color:#000}.panel{border-color:#000}textarea,input,pre{border-color:#000;color:#000;background:#fff}}
.panel>.ref{grid-template-columns:1fr}
#demo{margin-bottom:12px;border-left-color:var(--cy)}
#demo h2{margin-bottom:2px}
#gc{display:block;width:100%;max-width:640px;height:auto;aspect-ratio:20/11;image-rendering:pixelated;background:#000;border:2px solid var(--bd);border-radius:6px;margin:8px 0 4px}
.drow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.drow button{padding:6px 14px}.drow button[aria-pressed=true]{background:var(--cy);color:var(--bg)}
.drow label{display:flex;align-items:center;gap:8px;min-height:2.75rem;font-weight:700;cursor:pointer}.drow input{width:1.4rem;height:1.4rem}
#dv{font-size:.8125rem;color:var(--tx)}
@media print{#demo{display:none!important}}

[hidden]{display:none!important}
/* ---- teaching widgets (tile painter + animator state machine) ---- */
.wg{margin:14px 0;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);padding:12px 14px}
.wg h3{margin:0 0 2px}
.wg .hint{margin:2px 0 8px}
.wg [hidden]{display:none!important}
.wg button{min-height:2.5rem;padding:5px 12px;font-size:.8125rem}
.wg button[aria-pressed=true]{background:var(--cy);color:var(--bg);border-color:var(--cy)}
.wg label.chk{display:flex;align-items:center;gap:8px;min-height:2.5rem;font-weight:700;cursor:pointer;font-size:.875rem;color:var(--tx)}
.wg input[type=checkbox]{width:1.3rem;height:1.3rem}
.wg select{min-height:2.5rem;font-size:.875rem;padding:4px 8px}
.wbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.wg .lbl{font-size:.75rem;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--mu)}
.hier{background:var(--card);border:1.5px solid var(--bd);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.875rem}
.hier .hl{font-weight:700;color:var(--hd);margin-bottom:4px}
.lay{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin-left:14px;padding:3px 0 3px 10px;border-left:2px solid var(--bd)}
.cmp{color:var(--mu);font-size:.8125rem}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.pal button{padding:4px 6px;min-height:3.4rem;min-width:3.6rem;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.6875rem;background:var(--card);color:var(--tx);border:2px solid var(--bd)}
.pal button[aria-pressed=true]{background:var(--card);color:var(--tx);border-color:var(--am);box-shadow:0 0 0 2px var(--am)}
.pal canvas{width:32px;height:32px;image-rendering:pixelated;border-radius:3px}
.tmcv{display:block;width:100%;max-width:640px;height:auto;aspect-ratio:20/11;image-rendering:pixelated;background:#5ec8f2;border:2px solid var(--bd);border-radius:6px;touch-action:none;cursor:crosshair;margin:4px 0}
.stat{font:.8125rem/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--card);border:1.5px solid var(--bd);border-radius:8px;padding:8px 10px;margin:8px 0;color:var(--tx)}
.stat div{overflow-wrap:anywhere}
.fmrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;margin:8px 0}
.prm{flex:1 1 260px;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:2.5rem}
.prow .pt{font-size:.6875rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--bg);background:var(--am);padding:2px 6px;border-radius:4px;min-width:4.4rem;text-align:center}
.prow label{font-weight:700;color:var(--hd)}
.prow input[type=range]{flex:1 1 120px;min-width:100px;accent-color:var(--cy)}
.prow output{min-width:2.4em;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.875rem}
.dot{display:inline-block;width:1.1rem;height:1.1rem;border-radius:50%;border:2px solid var(--mu)}
.dot.on{background:var(--am);border-color:var(--am)}
.fmcv{flex:0 0 auto;width:min(100%,240px);height:auto;aspect-ratio:5/3;image-rendering:pixelated;border:2px solid var(--bd);border-radius:6px;background:#5ec8f2}
.fmwrap{overflow-x:auto;border:1.5px solid var(--bd);border-radius:8px;background:var(--card);margin:8px 0}
.fmsvg{display:block;min-width:560px;width:100%;height:auto}
.fmsvg .nd{fill:var(--card);stroke:var(--bd);stroke-width:2}
.fmsvg .any .nd{stroke:var(--cy)}
.fmsvg .entry .nd{stroke:var(--li)}
.fmsvg .def .nd{stroke:var(--am);stroke-width:3}
.fmsvg .on .nd{fill:var(--cy);stroke:var(--cy)}
.fmsvg .nsel .nd{stroke:var(--pk);stroke-width:4}
.fmsvg .nt{fill:var(--hd);font:700 14px "Trebuchet MS",Arial,sans-serif}
.fmsvg .on .nt{fill:var(--bg)}
.fmsvg .pb{fill:var(--bg)}
.fmsvg .ng{cursor:pointer}
.fmsvg .ed{fill:none;stroke:var(--mu);stroke-width:2;marker-end:url(#fm-an)}
.fmsvg .ed.def{stroke:var(--am);marker-end:url(#fm-aa)}
.fmsvg .ed.wait{stroke:var(--pk);stroke-dasharray:6 4;marker-end:url(#fm-ap)}
.fmsvg .ed.sel{stroke:var(--cy);stroke-width:3;marker-end:url(#fm-as)}
.fmsvg .ed.fire{stroke:var(--li);stroke-width:4;marker-end:url(#fm-ag)}
.fmsvg .hit{fill:none;stroke:transparent;stroke-width:18;cursor:pointer;pointer-events:stroke}
.fmsvg .el{fill:var(--tx);font:12px Calibri,Arial,sans-serif}
.hico{vertical-align:-7px;margin-right:12px;color:var(--cy)}
.alth{margin:22px 0 6px;padding-top:12px;border-top:3px solid var(--cy)}
.insp{background:var(--card);border:1.5px solid var(--bd);border-left:5px solid var(--cy);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:.9375rem}
.insp p{margin:4px 0}.insp ul{margin:4px 0 4px 1.2rem;padding:0}
.flog{margin:4px 0 0 1.2rem;padding:0;font-size:.875rem;color:var(--tx)}
@media print{.wg{display:none!important}}
</style>

<body>
<a class="skip" href="#main">Skip to main content</a>
<div class="a11y" id="a11y" role="toolbar" aria-label="Accessibility options"><div class="a11y-in">
  <span class="a11y-l">Accessibility</span>
  <div class="grp" role="group" aria-label="Colour theme">
    <button type="button" id="th-day" aria-label="Day theme" title="Day theme" aria-pressed="false"><i class="fa-solid fa-sun" data-fb="☀" aria-hidden="true"></i><span class="a11y-text"> Day</span></button>
    <button type="button" id="th-night" aria-label="Night theme" title="Night theme" aria-pressed="false"><i class="fa-solid fa-moon" data-fb="☾" aria-hidden="true"></i><span class="a11y-text"> Night</span></button>
    <button type="button" id="th-contrast" aria-label="Contrast theme" title="Contrast theme" aria-pressed="false"><i class="fa-solid fa-circle-half-stroke" data-fb="◐" aria-hidden="true"></i><span class="a11y-text"> Contrast</span></button>
  </div>
  <div class="grp" role="group" aria-label="Text size">
    <button type="button" id="fm" aria-label="Decrease text size">A-</button><span id="fsd" aria-live="polite">100%</span><button type="button" id="fp" aria-label="Increase text size">A+</button>
  </div>
  <button type="button" class="solo" id="dys" aria-label="Dyslexic font" title="Dyslexic font" aria-pressed="false"><i class="fa-solid fa-font" data-fb="Aa" aria-hidden="true"></i><span class="a11y-text"> Dyslexic font</span></button>
</div></div>
<header><span class="tag" id="kick"></span><h1 id="ttl"></h1><p class="sub" id="sub"></p></header>
<main id="main" tabindex="-1">
  <div class="tts" role="group" aria-label="Read aloud">
    <button type="button" id="rd"><i class="fa-solid fa-volume-high" data-fb="🔊" aria-hidden="true"></i> Read this card</button>
    <button type="button" id="ps"><i class="fa-solid fa-pause" data-fb="⏸" aria-hidden="true"></i> <span id="pst">Pause</span></button>
    <button type="button" id="st"><i class="fa-solid fa-stop" data-fb="⏹" aria-hidden="true"></i> Stop</button>
    <label for="sp">Speed</label>
    <select id="sp"><option value="0.8">0.8x</option><option value="1" selected>1x</option><option value="1.2">1.2x</option></select>
  </div>
  <p class="hint" id="dh"></p>
  <div id="tabs" role="tablist" aria-label="Steps"></div>
  <section id="demo" class="panel" aria-labelledby="demo-h">
    <h2 id="demo-h">Game preview</h2>
    <p class="hint" id="dn"></p>
    <canvas id="gc" tabindex="0" role="img" aria-label="Playable pixel platformer preview. Click it, then use arrow keys or A and D to move, Space or W to jump, Shift to run. The variables line below the game shows the same state as text."></canvas>
    <p class="hint">Click the game, then arrows or A/D to move, Space or W to jump (jump again in the air), hold Shift to run. On a touch screen use the buttons.</p>
    <div class="drow" role="group" aria-label="Game controls">
      <button type="button" class="alt" data-gk="left"><span aria-hidden="true">&#9664;</span> Left</button>
      <button type="button" class="alt" data-gk="right">Right <span aria-hidden="true">&#9654;</span></button>
      <button type="button" class="alt" data-gk="jump">Jump</button>
      <button type="button" class="alt" data-gk="run" aria-pressed="false">Run</button>
      <button type="button" class="alt" id="drs">Restart</button>
      <button type="button" class="alt" id="dps" aria-pressed="false"><span>Pause</span></button>
    </div>
    <div class="drow">
      <label id="dcw" hidden><input type="checkbox" id="dc"> Show colliders</label>
      <label id="dpw" hidden><input type="checkbox" id="dp" checked> Parent player to platform (SetParent)</label>
    </div>
    <div class="drow" id="daw" hidden>
      <label>Wait at each waypoint <input type="range" id="dww" min="0" max="3" step="0.5" value="1"> <output id="dwo">1s</output></label>
      <label>Enemy speed <input type="range" id="dws" min="0.4" max="2" step="0.1" value="0.8"> <output id="dso">0.8</output></label>
    </div>
    <p class="hint">Variables in your scripts right now:</p><code id="dv"></code>
  </section>

public class MovingPlatform : MonoBehaviour
{
    public Transform platform;      // the platform that moves
    public Transform startPoint;    // empty object, NOT a child of the platform
    public Transform endPoint;      // empty object, NOT a child of the platform
    public float speed = 1.5f;
    public int direction = 1;       // 1 = heading to start, -1 = heading to end

    // Draws the route in the Scene view
    void OnDrawGizmos()
    {
        if (platform != null && startPoint != null && endPoint != null)
        {
            Gizmos.DrawLine(platform.position, startPoint.position);
            Gizmos.DrawLine(platform.position, endPoint.position);
        }
    }

    void Update()
    {
        Vector2 target = CurrentTarget();
        platform.position = Vector2.Lerp(platform.position, target, speed * Time.deltaTime);

        // Lerp slows down and never quite arrives, so turn round a little early
        float distance = (target - (Vector2)platform.position).magnitude;
        if (distance <= 0.1f)
            direction *= -1;        // 1 becomes -1, -1 becomes 1

        if (col.gameObject.CompareTag("Player"))

    void OnCollisionExit2D(Collision2D col)

public class CircularMovingPlatform : MonoBehaviour
{
    public Transform platform;       // the platform to move
    public Transform centerPoint;    // centre of the circle
    public Transform radiusPoint;    // its distance from the centre sets the radius
    public float speed = 1.5f;       // radians per second

    float angle;
    float radius;

    void Start()
    {
        radius = Vector2.Distance(centerPoint.position, radiusPoint.position);
    }

    void Update()
    {
        angle += speed * Time.deltaTime;
        // Cos and Sin work in radians, so one full turn is 2 x PI (not 360)
        if (angle >= Mathf.PI * 2f) angle -= Mathf.PI * 2f;

        float x = centerPoint.position.x + Mathf.Cos(angle) * radius;
        float y = centerPoint.position.y + Mathf.Sin(angle) * radius;
        platform.position = new Vector2(x, y);
    }

    void OnDrawGizmos()
    {
        if (centerPoint != null && radiusPoint != null)
        {
            float r = Vector2.Distance(centerPoint.position, radiusPoint.position);
            Gizmos.color = Color.cyan;
            Gizmos.DrawWireSphere(centerPoint.position, r);
            Gizmos.color = Color.yellow;
            Gizmos.DrawLine(centerPoint.position, radiusPoint.position);

    }

    // Carry the player: make them a child while they stand on the platform

[RequireComponent(typeof(Rigidbody2D), typeof(BoxCollider2D))]
public class EnemyAI : MonoBehaviour
{
    [SerializeField] Transform player;
    [SerializeField] SpriteRenderer sprite;
    [SerializeField] LayerMask ground, wall;
    [SerializeField, Min(0f)] float moveSpeed = 2f;
    [SerializeField, Min(0f)] float detectionRange = 4f;
    [SerializeField, Min(0.1f)] float followDuration = 3f;

    Rigidbody2D rb;
    BoxCollider2D box;
    int patrolDirection = 1;
    bool canStartChase = true;
    float chaseTime;

    void Awake()
    {
        rb = GetComponent<Rigidbody2D>();
        box = GetComponent<BoxCollider2D>();
    }

    void FixedUpdate()
    {
        bool inRange = player != null &&
            Vector2.Distance(rb.position, (Vector2)player.position) <= detectionRange;

        if (!inRange) canStartChase = true;
        if (inRange && canStartChase && chaseTime <= 0f)
        {
            chaseTime = followDuration;
            canStartChase = false;
        }

        bool chasing = chaseTime > 0f && player != null;
        int direction = patrolDirection;
        if (chasing)
        {
            float offset = player.position.x - rb.position.x;
            direction = Mathf.Abs(offset) < 0.1f ? 0 : (offset < 0f ? -1 : 1);
        }
        chaseTime = Mathf.Max(0f, chaseTime - Time.fixedDeltaTime);

        if (direction != 0 && !CanWalk(direction))
        {
            if (!chasing)
            {
                patrolDirection = -direction;
                direction = CanWalk(patrolDirection) ? patrolDirection : 0;
            }
            else direction = 0; // Wait at the wall or ledge during a chase.
        }

        if (sprite != null && direction != 0) sprite.flipX = direction < 0;
#if UNITY_6000_0_OR_NEWER
        rb.linearVelocity = new Vector2(moveSpeed * direction, rb.linearVelocity.y);
#else
        rb.velocity = new Vector2(moveSpeed * direction, rb.velocity.y);
#endif
    }

    bool CanWalk(int direction)
    {
        Bounds b = box.bounds;
        // Look just beyond the leading edge of the box.
        float lookAhead = Mathf.Max(0.05f, moveSpeed * Time.fixedDeltaTime);
        float edgeX = b.center.x + direction * b.extents.x;
        Vector2 edge = new Vector2(edgeX, b.center.y);
        Vector2 foot = new Vector2(edgeX + direction * lookAhead, b.min.y + 0.05f);
        bool wallAhead = Physics2D.Raycast(edge, Vector2.right * direction,
            lookAhead, wall).collider != null;
        bool groundAhead = Physics2D.Raycast(foot, Vector2.down,
            0.2f, ground).collider != null;
        return !wallAhead && groundAhead;
    }
}`,

            waypoints[index] == null) return;

        if (sr != null) sr.flipX = target.x < transform.position.x;   // face the way we walk
        transform.position = Vector2.MoveTowards(

        if (Mathf.Abs(transform.position.x - target.x) < 0.05f)
            StartCoroutine(WaitThenNext());

        if (index + direction < 0 || index + direction >= waypoints.Length)
            direction = -direction;   // turn around at either end
        index += direction;
        waiting = false;
    }
}`,

endLvl:`using UnityEngine;
using UnityEngine.SceneManagement;

public class EndLevel : MonoBehaviour
{
    public string nextSceneName;              // scene to load next (must be in Build Settings)
    public DisplayMessage displayMessage;     // drag the Finish object in
    public string showMessage;                // e.g. "Level complete!"

    private void OnCollisionEnter2D(Collision2D other)
    {
        if (other.gameObject.tag == "Player")   // did the player touch the signpost?
        {
            displayMessage.ShowMessage(showMessage);

    }

{title:"Colliders & Tilemaps",icon:"border-all",fb:"▦",intro:"Learn the 2D collider types, then paint your own Tilemap layers and build a level with a Rule Tile.",
 body:`<h3>2D colliders</h3><ul><li><b>BoxCollider2D</b>: platforms, crates. <b>CircleCollider2D</b>: coins, balls. <b>CapsuleCollider2D</b>: characters, smooth over tile edges.</li><li><b>PolygonCollider2D</b> traces a sprite. <b>EdgeCollider2D</b> is a line, good for slopes.</li><li><b>Solid</b> colliders use <code>OnCollisionEnter2D</code>. <b>Triggers</b> use <code>OnTriggerEnter2D</code>. At least one object needs a <b>Rigidbody2D</b>.</li></ul><h3>Tilemaps</h3><ul><li><b>GameObject → 2D Object → Tilemap → Rectangular</b> makes a Grid with a Tilemap child.</li><li>Open <b>Window → 2D → Tile Palette</b> and drag sprites in to make tiles.</li><li>Add <b>Tilemap Collider 2D</b>, then <b>Composite Collider 2D</b> (tick <i>Used By Composite</i>, Rigidbody2D Static) to merge tiles into one shape.</li><li><b>Rule Tiles</b> pick the right sprite (corner, edge, centre) from neighbour rules.</li></ul>`,

{title:"Platforms",icon:"truck",fb:"🚚",intro:"Make platforms move from A to B, in a circle or round a list of points, and carry the player with them.",
 body:`<p>A moving platform carries its children. When the player lands, make them a child with <code>SetParent</code>. When they leave, set the parent back to null. Keep the points <i>outside</i> the platform, and flip the sprite with <code>sr.flipX</code>, not scale, so a parent never distorts the player.</p><h3>Set-up</h3><ol><li>Create a new script (for example <code>MovingPlatform</code>) and attach it to the platform.</li><li>Add empty objects for the points: <code>StartPoint</code> and <code>EndPoint</code> (circle: <code>CenterPoint</code> and <code>RadiusPoint</code>).</li><li>Put the platform and its points in one empty parent called <code>moving platform</code>, then drag each into the script's slots.</li></ol><h3>Three kinds of movement</h3><ul><li><b>A to B:</b> <code>MoveTowards</code> moves at a steady speed. <code>Vector2.Lerp(current, target, speed * Time.deltaTime)</code> covers a fraction of the remaining distance each frame, so it is quick at first and eases to a stop. It never quite arrives, so we turn round when the distance is under 0.1. <code>direction *= -1</code> flips 1 and -1.</li><li><b>Circle:</b> a point on a circle is <code>centre + (cos angle, sin angle) * radius</code>. <code>Mathf.Cos</code> and <code>Sin</code> use <b>radians</b>, so one lap is 2 x PI.</li><li><b>Array of points:</b> a list of waypoints (a zigzag or rectangle). <code>% points.Length</code> wraps from the last point back to the first.</li></ul><p><code>OnDrawGizmos</code> draws the route in the Scene view, so you can check it before you press Play. More help: <a href="https://www.monkeykidgc.com/2021/03/unity-moving-platform.html" target="_blank" rel="noopener">Monkey Kid: Unity moving platform</a>.</p>`,

{title:"Switches",tk:11,lv:5,icon:"toggle-on",fb:"⏻",art:`<svg class="hico" viewBox="0 0 48 28" width="56" height="32" aria-hidden="true" focusable="false"><rect x="1.5" y="1.5" width="45" height="25" rx="12.5" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="34" cy="14" r="8" fill="currentColor"/></svg>`,intro:"Add a switch that turns a moving platform on and off, using a trigger collider.",
 body:`<p>Sometimes you want a controller to turn the platform movement on and off. A switch is an object with a collider set to <b>Is Trigger</b>. When the player touches it, <code>OnTriggerEnter2D</code> runs and tells the platform what to do. The same idea can open doors or move blocks that close passages.</p><ol><li>Create <code>PlatformSwitch</code> and attach it to the switch sprite. Add a <b>Box Collider 2D</b> and tick <b>Is Trigger</b>.</li><li>In <code>MovingPlatform</code> add <code>isMoving</code> and a public <code>SetIsMoving(bool)</code>, so other scripts can call it. Add <code>bool loop = true;</code> to choose whether it keeps going back and forth.</li><li>Drag the platform into the switch's <b>Platform</b> slot. <b>Start Moving</b> ticked turns the platform on, unticked turns it off.</li><li>Untick <b>loop</b> and the platform only travels once to its first target. Place it at the end point so it has somewhere to go.</li></ol><p>A solid platform uses <code>OnCollisionEnter2D</code>, a switch uses <code>OnTriggerEnter2D</code>. The switch must be a trigger, or the player will stand on it instead of pressing it.</p>`,

{title:"Animation",tk:7,lv:7,icon:"film",fb:"🎞",intro:"Use the Animator Controller, a state machine, to switch between Idle, Run, Jump and Attack. Try one in the playground first, then see the sprite sheet version with a single playerState number.",
 body:`<ol><li>Create clips: <b>Idle, Run, Jump</b>.</li><li>In the Animator add parameters <code>Speed</code> (float) and <code>IsGrounded</code> (bool).</li><li>Idle → Run when <code>Speed &gt; 0.1</code>. Run → Idle when <code>Speed &lt; 0.1</code>. Any State → Jump when <code>IsGrounded</code> is false.</li><li>Untick <b>Has Exit Time</b> so transitions react instantly.</li></ol><h3>State machine vocabulary</h3><ul><li><b>State</b>: one animation that is playing (Idle, Run, Jump).</li><li><b>Transition</b>: an arrow from one state to another. It fires when its <b>conditions</b> are true.</li><li><b>Parameters</b>: values your code sets. There are four kinds: <b>Float</b>, <b>Int</b>, <b>Bool</b> and <b>Trigger</b>.</li><li><b>Entry</b> and the orange <b>Default State</b>: where the machine starts. <b>Any State</b>: a transition from here can fire from every state.</li><li><b>Has Exit Time</b>: wait until the clip has played to a chosen point before leaving.</li></ul>`,
 body2:`<h2 class="alth">Alternative version: one int called playerState</h2><p>The version above uses a float and a bool. This one uses a single <b>int</b> called <code>playerState</code>, and adds a Death state. Your art often arrives as a <b>sprite sheet</b>, a grid of frames. An animation clip plays the frames in order, like a flipbook (<a href="https://learn.unity.com/tutorial/introduction-to-sprite-animations" target="_blank" rel="noopener">Unity Learn: Introduction to Sprite Animations</a>).</p><h3>1. Slice the sprite sheet</h3><ol><li>Select the image. In the Inspector set <b>Texture Type</b> to <i>Sprite (2D and UI)</i> and <b>Sprite Mode</b> to <i>Multiple</i>. Click <b>Apply</b>.</li><li>Click <b>Open Sprite Editor</b>, then <b>Slice</b>. Choose <i>Grid By Cell Count</i>, enter the columns and rows (for example C 4, R 2), click <b>Slice</b>, then <b>Apply</b>.</li></ol><h3>2. Make a clip for each animation</h3><ol><li>Expand the sheet and select the frames for one animation: Idle, Run or Jump.</li><li>Right-click and choose <b>Create → Animation</b>, or drag the frames into the Animation window. Name the clips <code>idle_hero</code>, <code>run_hero</code>, <code>jump_hero</code> and <code>death_hero</code>.</li><li>Double-click a clip and open the <b>Sprite</b> arrow: each frame is a keyframe.</li><li><b>Add Property greyed out?</b> Select the GameObject that has the Animator, watch it in the Scene view, pick the clip in the Animation window dropdown and press Play.</li></ol><h3>3. Connect them in the Animator</h3><ol><li>Drag the clips into the Animator window and add a transition from <b>Any State</b> to each one.</li><li>Add an <b>Int</b> parameter called <code>playerState</code>.</li><li>Give each transition a condition: <code>playerState Equals</code> 0 for Idle, 1 for Run, 2 for Jump and 3 for Death.</li><li>Untick <b>Has Exit Time</b>. If a clip keeps restarting from frame 1, open the transition's <b>Settings</b> and untick <b>Can Transition To Self</b>.</li></ol><p><b>Which one?</b> Float and bool read naturally (a speed, a yes or no). One int keeps the current state in one place, but the numbers are easy to mix up. Challenge: name them with an <code>enum</code>.</p>`,

{title:"Enemies & Spikes",tk:10,lv:8,icon:"route",fb:"➜",intro:"Build spikes and a rotating trap, then give an enemy a patrol and a short chase. Test how each hazard affects the player.",
 body:`<h3>Warm-up: absolute value and square root (5 min each)</h3>
 <p>Write a C# method that takes a number and returns its absolute value. Try <code>15, -2, -34, 12, 102, -12</code> → <code>15, 2, 34, 12, 102, 12</code>. Then try a square-root method: <code>64, 25, 9, 196, 16</code> → <code>8, 5, 3, 14, 4</code>. Use <code>MathF.Abs</code> and <code>MathF.Sqrt</code> in a modern C# console project, or <code>Mathf.Abs</code> and <code>Mathf.Sqrt</code> in Unity. Why is absolute value useful when measuring horizontal distance?</p>
 <h3>1. Spikes and rotating wheels</h3>
 <ol><li>Create <b>Trap</b> and <b>Enemy</b> tags. Give the spikes a solid Collider 2D fitted to the sprite, with <b>Is Trigger</b> off, and tag the collider object <b>Trap</b>.</li>
 <li>Make a wheel with a centred pivot, a solid Collider 2D and a <b>Kinematic Rigidbody2D</b>. Tag it <b>Trap</b> and attach <code>TrapWheel</code>. A circle collider stays the same shape as it spins; fit a Polygon Collider 2D if you want the teeth to matter.</li>
 <li>Attach <code>PlayerLife</code> to the player with its Dynamic Rigidbody2D. Assign a safe <b>Spawn Point</b> outside the player hierarchy and clear of hazards, your <b>Movement Script</b>, a TextMeshPro <b>Lives Text</b> and, optionally, a <b>Hit Sound</b>. Add the scene named in <b>Lose Scene</b> to the Unity 6 Build Profiles scene list (Build Settings in older versions).</li></ol>
 <p>For this exercise, <code>PlayerLife</code> owns lives, respawn and game over. Remove the Health lesson's enemy damage callback from <code>PlayerMovement</code> if you added it; keep movement and the coin counter. Do not call the Lives &amp; UI lesson's <code>GameManager.LoseLife()</code> for these hazards or display a second lives counter. A trap costs one life; an enemy ends the run. There is no stomp attack in this version.</p>
 <h3>2. Enemy patrol and chase</h3>
 <ol><li>On a flat platform, give the enemy a solid Box Collider 2D, a Dynamic Rigidbody2D with Z rotation frozen, and the <b>Enemy</b> tag. Add <code>EnemyAI</code> and assign the player and sprite in the Inspector. This example assumes the sprite faces right before flipping.</li>
 <li>Put walkable surfaces on <b>Ground</b> and blockers on <b>Wall</b>, then select those layers in the matching enemy masks. The masks select layers, not tags. Keep the enemy off both layers so the rays cannot hit its own collider. If you add invisible enemy-only walls, put the enemy on an <b>AI</b> layer and use the Physics 2D collision matrix to let the player's layer pass through those walls.</li>
 <li>The enemy patrols until the player comes into range. It chases horizontally for a set time, stopping at a wall or ledge, then resumes patrol. The player must leave range before another chase can start. Move in <code>FixedUpdate</code>, keep the vertical velocity for gravity, and use <code>flipX</code> for facing.</li></ol>
 <h3>3. Optional: earn an extra life</h3>
 <p>Attach <code>CherryCollector</code> to the <b>player</b>, with optional TextMeshPro text and pickup sound. Give each cherry a single trigger Collider 2D and the <b>Cherry</b> tag on that same object. Three cherries give one life and reset the cherry count. This can coexist with the existing coin counter. Use the <b>Levels</b> lesson if you also need a finish post.</p>
 <h3>Alternative: waypoint patrol</h3>
 <p>Use <code>EnemyPatrol</code> instead of <code>EnemyAI</code> if you want a fixed route with pauses. For this transform-based example use a Kinematic Rigidbody2D, place at least two waypoints outside the enemy hierarchy on the same height, and assign them in order. The browser preview demonstrates this waypoint version; it still uses the earlier health and stomp rules. Test spikes, respawns and chasing in Unity.</p>`,

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function toggleMic(el,b){
  if(recBtn===b){stopMic();return say("Stopped listening")}
  stopMic();
  const r=new SR(),base=el.value,sep=base&&!/\s$/.test(base)?" ":"";
  r.lang=navigator.language||"en-GB";r.interimResults=true;r.continuous=false;
  r.onresult=e=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;el.value=base+sep+t;el.dispatchEvent(new Event("input"))};
  r.onerror=e=>say(e.error==="not-allowed"||e.error==="service-not-allowed"?"The microphone is blocked here. Allow it in your browser settings, or use the microphone key on your keyboard.":e.error==="no-speech"?"I did not hear anything. Tap Dictate and try again.":"Dictation stopped ("+e.error+").");
  r.onend=()=>{if(rec===r){rec=null;recBtn=null}micIdle(b)};
  try{r.start()}catch(e){return say("Dictation could not start.")}

const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zipBlob(files,mime){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  files.forEach(f=>{
    const name=enc.encode(f[0]),d=enc.encode(f[1]),crc=crc32(d);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,name.length,true);
    parts.push(h.buffer,name,d);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    cd.push(c.buffer,name);off+=30+name.length+d.length;
  });
  let len=0;cd.forEach(b=>len+=b.byteLength);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,len,true);e.setUint32(16,off,true);
  return new Blob(parts.concat(cd,[e.buffer]),{type:mime});
}

  const cellAt=e=>{const b=cv.getBoundingClientRect(),c=Math.floor((e.clientX-b.left)/b.width*C),r=Math.floor((e.clientY-b.top)/b.height*R);return c<0||c>=C||r<0||r>=R?null:{c,r}};

      b.setAttribute("aria-pressed",S.sel[S.al]===id&&S.tool!=="erase");b.title=n;
      const t=document.createElement("canvas");t.width=T;t.height=T;t.setAttribute("aria-hidden","true");
      const tx=t.getContext("2d");tx.fillStyle="#5ec8f2";tx.fillRect(0,0,T,T);
      S.al==="g"?gArt(tx,id,0,0,{l:true,r:true,u:false,d:true}):dArt(tx,id,0,0);
      const s=document.createElement("span");s.textContent=n;
      b.append(t,s);b.onclick=()=>{S.sel[S.al]=id;if(S.tool==="erase")setTool("paint");drawPal();info();dirty=true;say(n+" selected")};
      pal.append(b);
    });
  }
  function setTool(t){S.tool=t;S.anchor=null;m.querySelectorAll("[data-tl]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tl===t));drawPal();info();dirty=true}
  function setLayer(k){S.al=k;h("lg").setAttribute("aria-pressed",k==="g");h("ld").setAttribute("aria-pressed",k==="d");drawPal();info();dirty=true;say(LN[k]+" Tilemap is now active")}
  function setTest(v){
    S.test=v;S.anchor=null;const b=h("tg");b.setAttribute("aria-pressed",v);b.querySelector("span").textContent=v?"Stop test":"Play test";
    m.querySelectorAll("[data-ed]").forEach(x=>{x.disabled=v||(x===ub&&!S.undo.length)});tchB.hidden=!v;
    if(v){spawn();key.left=key.right=key.run=0;key.jq=false;cv.focus();say("Play test started. Use arrow keys and Space.")}else say("Back to painting.");
    info();dirty=true;
  }
  const cellSay=()=>"Cell "+cur.c+", "+(R-1-cur.r)+". Ground: "+tname("g",cur.c,cur.r)+". Decoration: "+tname("d",cur.c,cur.r)+".";
  function act(){
    if(!cur)return;const c=cur.c,r=cur.r;
    if(S.tool==="paint"||S.tool==="erase"){snap();paintAt(c,r);changed();say((S.tool==="erase"?"Erased":"Painted "+NAMES[S.al][S.sel[S.al]])+" at cell "+c+", "+(R-1-r))}
    else if(S.tool==="fill"){snap();flood(c,r);changed();say("Flood filled from cell "+c+", "+(R-1-r))}
    else if(!S.anchor){S.anchor={c,r};dirty=true;say("Box corner set. Move the cursor and press Space again.")}
    else{snap();boxFill(S.anchor,cur);S.anchor=null;changed();say("Box filled")}
  }

  m.querySelectorAll("[data-tl]").forEach(b=>b.onclick=()=>{setTool(b.dataset.tl);say(TN[b.dataset.tl]+" tool")});
  h("lg").onclick=()=>setLayer("g");h("ld").onclick=()=>setLayer("d");
  h("vg").onchange=function(){S.vis.g=this.checked;dirty=true;say("Ground renderer "+(this.checked?"on":"off")+". Its collider still works.")};
  h("vd").onchange=function(){S.vis.d=this.checked;dirty=true;say("Decoration renderer "+(this.checked?"on":"off"))};
  h("ord").value=S.front?"1":"-1";h("ord").onchange=function(){S.front=this.value==="1";dirty=true;say("Decoration order in layer "+this.value)};
  h("col").value=S.col;h("col").onchange=function(){S.col=this.value;info();dirty=true};

  ub.disabled=!S.undo.length;ub.onclick=undo;

  h("rs").onclick=()=>{snap();example();changed();say("Example level restored")};
  h("tg").onclick=()=>setTest(!S.test);

  const up=()=>{if(down&&S.tool==="box"&&S.anchor&&cur){snap();boxFill(S.anchor,cur);S.anchor=null;changed()}down=false;last=null};
  cv.onpointerup=up;cv.onpointercancel=()=>{down=false;S.anchor=null;dirty=true};
  cv.onpointerleave=()=>{if(!down&&document.activeElement!==cv){cur=null;info();dirty=true}};
  cv.onfocus=()=>{if(!S.test&&!cur){cur={c:10,r:5};info()}dirty=true};

    const k=e.key;

      const mv={ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right",Shift:"run"};

    if(d){e.preventDefault();cur=cur||{c:10,r:5};cur={c:Math.max(0,Math.min(C-1,cur.c+d[0])),r:Math.max(0,Math.min(R-1,cur.r+d[1]))};dirty=true;info();say(cellSay());return}
    if(k===" "||k==="Enter"){e.preventDefault();act();return}
    if(k==="Delete"||k==="Backspace"){e.preventDefault();if(cur){snap();put(S.al,cur.c,cur.r,0);changed();say("Erased at cell "+cur.c+", "+(R-1-cur.r))}return}
    if(k==="Escape"){S.anchor=null;dirty=true;return}
    const t={b:"paint",B:"paint",u:"box",U:"box",g:"fill",G:"fill",d:"erase",D:"erase"}[k];if(t){setTool(t);say(TN[t]+" tool")}
  };
  cv.onkeyup=e=>{const mv={ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right",Shift:"run"};if(mv[e.key])key[mv[e.key]]=0};
  m.querySelectorAll("[data-tk]").forEach(b=>{
    const k=b.dataset.tk;
    if(k==="run"){b.onclick=()=>{key.run=key.run?0:1;b.setAttribute("aria-pressed",!!key.run)};return}
    if(k==="jump"){b.onpointerdown=e=>{e.preventDefault();key.jq=true};b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();key.jq=true}};return}
    const on=e=>{e.preventDefault();key[k]=1},off=()=>{key[k]=0};
    b.onpointerdown=on;b.onpointerup=off;b.onpointerleave=off;b.onpointercancel=off;
    b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();key[k]=1}};b.onkeyup=e=>{if(e.key==="Enter"||e.key===" ")key[k]=0};
  });

  drawPal();info();
  (function loop(){if(!m.isConnected)return;if(S.test)pstep();if(S.test||dirty){draw();dirty=false}requestAnimationFrame(loop)})();
};
})();

  const nm=id=>NS.find(n=>n.id===id).t;

<defs>${mkr("an","var(--mu)")+mkr("ag","var(--li)")+mkr("as","var(--cy)")+mkr("ap","var(--pk)")+mkr("aa","var(--am)")}</defs>

${NS.map(n=>`<g class="ng ${n.k||""}${n.def?" def":""}" data-n="${n.id}"><rect class="nd" x="${n.x}" y="${n.y}" width="120" height="44" rx="8"/><text class="nt" x="${n.x+60}" y="${n.y+(n.len?20:23)}" text-anchor="middle" dominant-baseline="middle">${n.t}</text>${n.len?`<rect class="pb" data-pb="${n.id}" x="${n.x+8}" y="${n.y+34}" width="0" height="5" rx="2"/>`:""}</g>`).join("")}
${TR.filter(t=>t.lt).map(t=>`<text class="el" data-l="${t.id}" x="${t.lx}" y="${t.ly}" text-anchor="${t.la}">${t.lt}</text>`).join("")}
${TR.map(t=>`<path class="hit" data-t="${t.id}" d="${t.d}"/>`).join("")}
</svg>`;
  m.innerHTML=`<h3>Try it: an Animator state machine</h3>
<p class="hint">This is the Animator window in miniature. Each box is a <b>state</b> (an animation). Each arrow is a <b>transition</b> that fires when its <b>conditions</b> are true. Change the parameters, watch the machine move, and click any state or arrow to inspect it.</p>
<div class="fmrow">
  <div class="prm" role="group" aria-label="Animator parameters">
    <div class="prow"><span class="pt">Float</span><label for="fm-sp">Speed</label><input type="range" id="fm-sp" min="0" max="8" step="0.1" value="0"><output id="fm-spo" for="fm-sp">0.0</output></div>
    <div class="prow"><span class="pt">Bool</span><label class="chk"><input type="checkbox" id="fm-gr" checked> IsGrounded</label><button type="button" class="alt" id="fm-jp">Simulate a jump</button></div>
    <div class="prow"><span class="pt">Trigger</span><button type="button" class="alt" id="fm-at">Set Attack</button><span class="dot" id="fm-dot" aria-hidden="true"></span><span class="cmp" id="fm-dt">not set</span></div>
    <label class="chk"><input type="checkbox" id="fm-ex"> Has Exit Time on Idle &#8644; Run (see the lag)</label>
    <div class="wbar"><button type="button" class="alt" id="fm-rs">Reset machine</button></div>
  </div>
  <canvas class="fmcv" id="fm-cv" width="80" height="48" role="img" aria-label="Preview of the character playing the current animation"></canvas>
</div>
<div class="stat"><div id="fm-now"></div></div>
<div class="fmwrap" tabindex="0" role="region" aria-label="Animator graph. Scrolls sideways on small screens.">${svg}</div>
<div class="wbar"><label class="chk"><span class="lbl">Inspect</span> <select id="fm-in" aria-label="Inspect a state or transition"></select></label></div>
<div class="insp" id="fm-ip"></div>
<div class="lbl">Transition log (newest first)</div>
<ol class="flog" id="fm-lg"></ol>
<p class="hint"><b>Try this:</b> 1) Drag Speed up: Idle goes to Run. 2) Untick IsGrounded: Any State forces Jump. 3) Tick Has Exit Time, then drag Speed: the character slides while still showing Idle, because it waits for the clip. 4) Press Set Attack while running: the trigger is used up, Attack plays once, then leaves by itself.</p>`;

  const g=id=>m.querySelector("#"+id),cv=g("fm-cv"),cx=cv.getContext("2d"),ex=g("fm-ex");
  const P={Speed:0,IsGrounded:true,Attack:false};
  let st="idle",tin=0,fire=null,fireT=0,sel="s:idle",gx=0,fr=0,lastTs=0,jt=null,shown="";
  const logA=[];
  const norm=()=>{const n=NS.find(x=>x.id===st);const u=tin/n.len;return n.once?Math.min(1,u):u%1};
  const cOK=c=>c[0]==="Speed"?(c[1]===">"?P.Speed>c[2]:P.Speed<c[2]):c[0]==="IsGrounded"?P.IsGrounded===c[2]:P.Attack;
  const need=t=>t.hx?t.exit:(t.ex&&ex.checked)?.9:null;
  const ready=t=>{if(!t.c.every(cOK))return"no";const e=need(t);return(e!==null&&norm()<e)?"wait":"yes"};

  function go(t){

    st=t.to;tin=0;fire=t.id;fireT=.45;
    logA.unshift(nm(t.f)+" \u2192 "+nm(t.to)+(t.c.length?"  ("+t.c.map(ctext).join(", ")+")":"  (exit time)"));if(logA.length>6)logA.pop();

      const out=TR.filter(t=>t.f===id).map(t=>nm(t.f)+" \u2192 "+nm(t.to)).join(", ")||"none";
      return"<b>"+n.t+"</b><ul><li>Motion: the "+n.t+" animation clip ("+n.len.toFixed(1)+" s, "+(n.once?"plays once":"loops")+")</li><li>"+(n.def?"This is the Default State.":"Reached from: "+TR.filter(t=>t.to===id).map(t=>nm(t.f)).join(", "))+"</li><li>Transitions out: "+esc(out)+"</li></ul>";
    }
    const t=TR.find(x=>x.id===id);
    if(t.def)return"<b>Entry \u2192 Idle</b><p>The default transition. It has no conditions: the machine simply starts in Idle.</p>";
    const e=need(t),anyT=t.f==="any";
    let note="";
    if(id==="i-r"||id==="r-i")note=ex.checked?"Has Exit Time is ticked, so even once the condition is true the machine waits until the clip is 90% played. The character slides along while still showing the old animation. This is why the lesson says to untick it.":"Has Exit Time is unticked, so the change happens the moment the condition becomes true.";
    else if(anyT)note="Any State transitions can fire from every state, so Jump can interrupt Run, Idle or Attack. Untick Can Transition To Self, otherwise Jump would restart every frame while you are in the air.";
    else if(id==="j-i")note="Landing: once IsGrounded is true again the machine returns to Idle, and Idle \u2192 Run can then take over if you are moving.";

  g("fm-in").onchange=function(){setSel(this.value)};

    jt=setTimeout(()=>{jt=null;if(!m.isConnected)return;P.IsGrounded=true;g("fm-gr").checked=true},900)};
  g("fm-at").onclick=()=>{P.Attack=true;say("Attack trigger set")};
  ex.onchange=()=>{setSel(sel);say("Has Exit Time "+(ex.checked?"ticked":"unticked")+" on Idle and Run transitions")};
  g("fm-rs").onclick=()=>{st="idle";tin=0;fire=null;fireT=0;P.Speed=0;P.IsGrounded=true;P.Attack=false;if(jt){clearTimeout(jt);jt=null}
    g("fm-sp").value=0;g("fm-spo").textContent="0.0";g("fm-gr").checked=true;ex.checked=false;logA.length=0;g("fm-lg").innerHTML="";setSel(sel);say("Machine reset to Idle")};

  }

};

/* ---------- Switch playground: the player triggers the platform ---------- */
WIDGETS.swgame=function(m){
  m.innerHTML=`<h3>Try it: step on the switch</h3>
<p class="hint">Click the game, then walk with the arrow keys or A and D and jump with Space (or use the buttons). The platform stays still until you touch the switch. The switch is a trigger, so <code>OnTriggerEnter2D</code> runs and calls <code>SetIsMoving</code>.</p>

<div class="stat"><div id="sg-st"></div></div>
<p class="hint"><b>Try this:</b> 1) Walk to the pit before touching the switch: the platform just sits there. 2) Touch the switch, then jump on and ride across. 3) Untick <i>loop</i> and press Reset: the platform crosses once and stops. 4) Untick <i>Start Moving</i>, then touch the switch: it turns the platform off instead. 5) Untick <i>Parent player</i> and see what happens on the ride.</p>`;

  hold("sg-l",v=>k.l=v);hold("sg-r",v=>k.r=v);hold("sg-j",v=>{if(v)jq=true});
  g("sg-rs").onclick=()=>{reset();say("Reset: the switch is off again")};
  function step(dt){
    let dx=0;
    if(PL.on){const t=PL.dir===1?SP:EP,nx=PL.x+(t-PL.x)*Math.min(1,1.5*dt);dx=nx-PL.x;PL.x=nx;if(g("sg-lp").checked&&Math.abs(t-PL.x)<=E)PL.dir*=-1}
    const d=k.r-k.l;px+=d*70*dt;if(d)face=d;

    px=Math.max(0,Math.min(310,px));
    if(jq&&gr){vy=-210;gr=false}jq=false;

    if(py>180){px=20;py=T-14;vy=0;say("You fell. Back to the start.")}
    const ov=px+10>50&&px<68&&py+14>=T-16;       // inside the switch's trigger collider
    if(ov&&!was){PL.on=g("sg-sm").checked;fired=true;say("Switch touched: platform "+(PL.on?"on":"off"))}
    was=ov;
  }
  const txt=(t,x,y)=>{cx.fillStyle="#fff";cx.font="bold 8px sans-serif";cx.fillText(t,x,y)};
  function draw(){

    cx.strokeStyle="rgba(29,27,58,.5)";cx.lineWidth=1.5;cx.beginPath();cx.moveTo(EP,T+14);cx.lineTo(SP,T+14);cx.stroke();

    cx.fillStyle="#4caf50";cx.fillRect(Math.round(PL.x-20),T,40,3);cx.fillStyle=PL.on?"#2f6fe0":"#555";cx.fillRect(Math.round(PL.x-20),T+3,40,4);

    cx.fillStyle=on?"#2ecc71":"#c0392b";cx.beginPath();cx.arc(on?68:52,T-20,4,0,7);cx.fill();
    txt("SWITCH",44,T-28);
    hero(cx,px,py,face,!gr?"jump":(k.l||k.r)?"run":"idle",fr,0);
  }
  function tick(ts){
    if(!m.isConnected)return;

  }

};

/* ---------- Platform movements playground: every example at once ---------- */
WIDGETS.pmv=function(m){
  m.innerHTML=`<h3>Try it: every platform movement</h3>
<p class="hint">Five platforms, one for each example in this lesson. Compare how they move, then try the switch platform at the bottom right.</p>
<div class="wbar"><label class="chk"><span class="lbl">Speed</span> <input type="range" id="pm-sp" min="0.5" max="4" step="0.1" value="1.5"><output id="pm-so" for="pm-sp">1.5</output></label><button type="button" class="alt" id="pm-ps" aria-pressed="false">Pause</button></div>
<div class="wbar"><button type="button" class="alt" id="pm-sw" aria-pressed="false">Switch: OFF (press to turn on)</button><label class="chk"><input type="checkbox" id="pm-lp" checked> loop</label><button type="button" class="alt" id="pm-rs">Reset switch platform</button></div>
<canvas class="tmcv" id="pm-cv" width="320" height="176" style="cursor:default" role="img" aria-label="Five moving platforms. Top left: an A to B platform using Lerp, and one using MoveTowards. Top right: a circular platform. Bottom left: a platform following an array of four points in a rectangle. Bottom right: a platform that only moves when the switch is on."></canvas>
<div class="stat"><div id="pm-st"></div></div>
<p class="hint"><b>Try this:</b> 1) Watch the two top-left platforms: Lerp slows as it nears each end, MoveTowards keeps a steady speed. 2) The rectangle platform visits four points in order, then wraps back to the first. 3) Press the switch, then untick loop and press Reset: the platform moves once to its first point and stops.</p>`;
  const g=id=>m.querySelector("#"+id),cv=g("pm-cv"),cx=cv.getContext("2d");
  const U=16,E=1.6;                       // 16 pixels = 1 unit; 0.1 unit = 1.6 px
  const mk=(a,b)=>({a,b,p:a.slice(),dir:1});
  const L=mk([22,22],[130,22]),M=mk([22,52],[130,52]),W=mk([190,160],[300,160]);
  W.p=W.b.slice();
  const C={c:[250,44],r:30,ang:0,p:[280,44]};
  const R={pts:[[22,100],[130,100],[130,150],[22,150]],i:0,p:[22,100]};
  let on=false,paused=false,last=0,shown="";
  const sp=()=>+g("pm-sp").value,dist=(p,q)=>Math.hypot(q[0]-p[0],q[1]-p[1]);
  const lerp=(o,t,k)=>{o.p[0]+=(t[0]-o.p[0])*k;o.p[1]+=(t[1]-o.p[1])*k};
  const toward=(o,t,d)=>{const n=dist(o.p,t);if(n<=d){o.p[0]=t[0];o.p[1]=t[1]}else{o.p[0]+=(t[0]-o.p[0])/n*d;o.p[1]+=(t[1]-o.p[1])/n*d}};
  g("pm-sp").oninput=function(){g("pm-so").textContent=(+this.value).toFixed(1)};
  g("pm-ps").onclick=function(){paused=!paused;this.setAttribute("aria-pressed",paused);this.textContent=paused?"Play":"Pause";say(paused?"Paused":"Playing")};
  g("pm-sw").onclick=function(){on=!on;this.setAttribute("aria-pressed",on);this.textContent=on?"Switch: ON (press to turn off)":"Switch: OFF (press to turn on)";say("Switch "+(on?"on":"off"))};
  g("pm-rs").onclick=()=>{W.p=W.b.slice();W.dir=1;say("Switch platform reset")};
  function step(dt){
    const s=sp();
    lerp(L,L.dir===1?L.a:L.b,Math.min(1,s*dt));if(dist(L.p,L.dir===1?L.a:L.b)<=E)L.dir*=-1;
    toward(M,M.dir===1?M.a:M.b,s*U*.8*dt);if(dist(M.p,M.dir===1?M.a:M.b)<E)M.dir*=-1;
    C.ang+=s*dt;if(C.ang>=Math.PI*2)C.ang-=Math.PI*2;
    C.p=[C.c[0]+Math.cos(C.ang)*C.r,C.c[1]+Math.sin(C.ang)*C.r];
    toward(R,R.pts[R.i],s*U*.8*dt);if(dist(R.p,R.pts[R.i])<E)R.i=(R.i+1)%R.pts.length;
    if(on){const t=W.dir===1?W.a:W.b;lerp(W,t,Math.min(1,s*dt));if(g("pm-lp").checked&&dist(W.p,t)<=E)W.dir*=-1}
  }
  const dot=(p,c)=>{cx.fillStyle=c||"#1d1b3a";cx.beginPath();cx.arc(p[0],p[1],2.5,0,7);cx.fill()};
  const line=(a,b)=>{cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke()};
  const plat=(p,c)=>{cx.fillStyle="#4caf50";cx.fillRect(Math.round(p[0]-14),Math.round(p[1]-3),28,3);cx.fillStyle=c||"#7a4a22";cx.fillRect(Math.round(p[0]-14),Math.round(p[1]),28,4)};
  const txt=(t,x,y)=>{cx.fillStyle="#fff";cx.font="bold 8px sans-serif";cx.fillText(t,x,y)};
  function draw(){
    cx.fillStyle="#5ec8f2";cx.fillRect(0,0,320,176);
    cx.strokeStyle="rgba(29,27,58,.55)";cx.lineWidth=1.5;
    line(L.a,L.b);line(M.a,M.b);line(W.a,W.b);
    cx.beginPath();cx.arc(C.c[0],C.c[1],C.r,0,7);cx.stroke();
    cx.beginPath();R.pts.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));cx.closePath();cx.stroke();
    [L.a,L.b,M.a,M.b,W.a,W.b,C.c].concat(R.pts).forEach(q=>dot(q));
    plat(L.p);plat(M.p);plat(C.p);plat(R.p);plat(W.p,on?"#2f6fe0":"#555");
    // the switch: a lever that flips
    cx.fillStyle="#555";cx.fillRect(238,128,24,6);
    cx.strokeStyle=on?"#2ecc71":"#c0392b";cx.lineWidth=3;cx.beginPath();cx.moveTo(250,128);cx.lineTo(on?262:238,on?112:112);cx.stroke();
    cx.fillStyle=on?"#2ecc71":"#c0392b";cx.beginPath();cx.arc(on?262:238,112,4,0,7);cx.fill();
    txt("A to B: Lerp",22,12);txt("A to B: MoveTowards",22,42);txt("Circle",232,10);txt("Array of points",22,92);txt("Switch platform",190,148);txt("Switch",232,146);
  }
  function tick(ts){
    if(!m.isConnected)return;
    const dt=last?Math.min(.05,(ts-last)/1000):.016;last=ts;
    if(!paused)step(dt);
    draw();
    const s="Switch: "+(on?"ON":"OFF")+"    loop: "+g("pm-lp").checked+"    switch platform: "+(!on?"waiting":(!g("pm-lp").checked&&dist(W.p,W.dir===1?W.a:W.b)<=E)?"stopped at its first point":"moving")+"    array point: "+(R.i+1)+" of 4";
    if(s!==shown){shown=s;g("pm-st").textContent=s}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
};

WIDGETS.fsm2=function(m){

    <label class="chk"><input type="checkbox" id="f2-au"> Let PlayerAnimation.cs set playerState</label>

    const t=TR.find(x=>x.f==="any"&&x.n===P.ps);
    if(t){if(t.to!==st)go(t);else if(g("f2-sf").checked){tin=0;rst++}}
    paint();requestAnimationFrame(tick);
  }
  setSel("s:idle");requestAnimationFrame(tick);
};

/* ===== 10. BOOT ===== */
function boot(){
  try{const s=JSON.parse(load("Data")||"null");if(s&&s.data&&s.v<=CFG.version)Object.keys(s.data).forEach(k=>{if(okKey(k)&&typeof s.data[k]==="string")data[k]=s.data[k]})}catch(e){}
  document.title=CFG.title;$("kick").textContent=CFG.kicker;$("ttl").textContent=CFG.title;$("sub").textContent=CFG.sub;
  THEMES.forEach(t=>$("th-"+t).onclick=()=>setTheme(t));
  $("fm").onclick=()=>setFont(-1);$("fp").onclick=()=>setFont(1);$("dys").onclick=()=>setDys(!dys);
  $("rd").onclick=()=>speak(readText());
  $("ps").onclick=()=>{if(!hasTTS)return;if(speechSynthesis.paused){speechSynthesis.resume();$("pst").textContent="Pause"}else if(speechSynthesis.speaking){speechSynthesis.pause();$("pst").textContent="Resume"}};
  $("st").onclick=stopTTS;$("sp").onchange=()=>{spd=+$("sp").value};
  addEventListener("pagehide",()=>{stopTTS();stopMic()});
  $("dh").textContent=SR?"Tip: tap Dictate under any box and speak. Your browser's speech service may send the audio away, so do not say personal details.":"Dictation is not supported in this browser. On a phone, use the microphone key on your keyboard.";
  $("mo").innerHTML=EXPORTS.map(x=>`<button type="button" class="alt opt" id="x-${x.id}">${ic(x.ic,x.fb)}<span>${esc(x.label)}<small>${esc(x.desc)}</small></span></button>`).join("");
  EXPORTS.forEach(x=>$("x-"+x.id).onclick=()=>{closeM();runExport(x)});
  $("xopen").onclick=openM;$("xcl").onclick=closeM;$("xcp").onclick=copyText;$("xpr").onclick=()=>window.print();
  $("bks").onclick=()=>{closeM();backup()};$("bki").onclick=()=>$("bkf").click();
  $("bkf").onchange=function(){closeM();importBackup(this.files[0]);this.value=""};
  $("mdl").onclick=e=>{if(e.target===$("mdl"))closeM()};
  $("mdl").onkeydown=e=>{
    if(e.key==="Escape"){e.preventDefault();closeM();return}
    if(e.key!=="Tab")return;
    const f=mEls();if(!f.length)return;const i=f.indexOf(document.activeElement);
    if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}
  };
  $("clr").onclick=()=>{if(!confirm("Clear everything you have written? This cannot be undone."))return;data={};persist();openTab(0);say("Everything cleared")};
  setTheme(theme||(matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"day":"night"));
  applyFont();setDys(dys);drawTabs();drawPanel();
  if(window.claude&&claude.use)claude.use("downloads").then(d=>{if(d)dl=d},()=>{});
}
boot();
</script>
<script>
(function(){
const $=id=>document.getElementById(id);
const cv=$("gc"),cx=cv.getContext("2d"),W=320,H=176,T=16,PW=10,PH=14;
cv.width=W;cv.height=H;
const MAP=["....................","....................","....................","....................","....................","....................","..........###.......","....................","....###......###....","....................","###....#############"];
const NEW=[
"Scene set up. The GameManager holds the coin count (top-left). Nothing moves yet because there is no movement script.",
"PlayerMovement added: walk, hold Shift to run, jump, then jump again in mid-air for the double jump. Watch canDoubleJump below.",
"Coin script added: coins are triggers. Turn on Show colliders to see them (yellow). Collect coins and watch coins go up.",
"Tilemap and Rule Tile added: the ground now has grass tops and shaded edges. Turn on Show colliders to see the tile colliders.",
"HealthSystem added: stomp the red enemy (30 health) or touch it and lose 25 of your 100 health.",
"Moving platform added over a new pit. Untick the parent option, stand on the platform, and see what changes.",
"Lives added: three hearts top-right. Falling in the pit or running out of health costs a life.",
"Animator added: the player now has Idle, Run and Jump animations. The Animator state shows below.",
"Waypoint patrol preview: the enemy walks between numbered waypoints and waits at each one. Use the sliders to change the wait time and speed.",
"Scene management added: Start, Win and Lose screens. Collect coins and reach the flag on the right to win."];
class HealthSystem{constructor(m){this.max=m;this.cur=m}takeDamage(a){this.cur=Math.max(0,this.cur-a)}heal(a){this.cur=Math.min(this.max,this.cur+a)}isDead(){return this.cur<=0}pct(){return this.cur/this.max}}
let L=0,F={},G,keys={left:0,right:0,run:0},jq=false,paused=false,t=0,show=false,parent=true,lastRO="";
let WP=[150,205,260],WAIT=1,SPD=.8;
const tile=(c,r)=>(c<0||c>=20||r<0||r>10)?false:(r===10&&!F.pit)?true:MAP[r][c]==="#";
function hit(x,y){const c0=Math.floor(x/T),c1=Math.floor((x+PW-.01)/T),r0=Math.floor(y/T),r1=Math.floor((y+PH-.01)/T);for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(tile(c,r))return{c,r};return null}
const ov=(ax,ay,aw,ah,bx,by,bw,bh)=>ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
function reset(){G={scene:F.scenes?"start":"play",x:16,y:146,vx:0,vy:0,pb:160,dir:0,onG:true,jumps:0,face:1,coins:0,lives:3,hp:new HealthSystem(100),inv:0,riding:false,st:"Idle",
 cs:[[72,112],[96,112],[168,80],[184,80],[224,112],[240,112],[130,146]].map(c=>({x:c[0],y:c[1],on:true})),
 en:{x:200,y:148,d:-1,alive:true,hp:new HealthSystem(30),wi:1,wd:1,wait:0},pl:{x:40,d:1}}}
function respawn(){G.x=16;G.y=146;G.vx=0;G.vy=0;G.hp=new HealthSystem(100);G.inv=60}
function die(){
  if(F.lives){G.lives--;if(G.lives<=0){if(F.scenes){G.scene="lose";return}G.lives=3}}
  respawn();
}
function step(){
  t++;if(G.inv>0)G.inv--;
  if(G.scene!=="play")return;
  G.dir=keys.right-keys.left;
  let pdx=0;
  if(F.plat){const p=G.pl;pdx=.6*p.d;p.x+=pdx;if(p.x>=96)p.d=-1;if(p.x<=40)p.d=1}
  const carry=(F.plat&&G.riding&&parent)?pdx:0;
  G.vx=F.move?G.dir*(keys.run?2.1:1.3):0;
  if(F.move&&G.dir)G.face=G.dir;
  if(jq){jq=false;if(F.move){if(G.onG){G.vy=-6.2;G.jumps=1}else if(G.jumps===1){G.vy=-6.2;G.jumps=2}}}
  G.x=Math.max(0,Math.min(W-PW,G.x+G.vx+carry));
  let h=hit(G.x,G.y);
  if(h){G.x=(G.vx+carry>0)?h.c*T-PW:(h.c+1)*T}
  G.pb=G.y+PH;G.vy=Math.min(G.vy+.35,8);G.y+=G.vy;G.onG=false;G.riding=false;
  h=hit(G.x,G.y);
  if(h){if(G.vy>0){G.y=h.r*T-PH;G.onG=true;G.jumps=0}else G.y=(h.r+1)*T;G.vy=0}
  if(F.plat&&G.vy>=0){const top=144,p=G.pl;if(G.x+PW>p.x&&G.x<p.x+32&&G.pb<=top+.5&&G.y+PH>=top){G.y=top-PH;G.vy=0;G.onG=true;G.riding=true;G.jumps=0}}
  if(G.y>H+10)return die();
  G.st=!G.onG?"Jump":Math.abs(G.vx)>.1?"Run":"Idle";
  if(F.coin)G.cs.forEach(c=>{if(c.on&&ov(G.x,G.y,PW,PH,c.x-4,c.y-4,8,8)){c.on=false;G.coins++}});
  if(F.enemy&&G.en.alive){
    const e=G.en;
    if(F.ai){if(e.wait>0)e.wait--;else{const tx=WP[e.wi],dx=tx-e.x;
      if(Math.abs(dx)<=SPD){e.x=tx;e.wait=Math.round(WAIT*60);if(e.wi+e.wd<0||e.wi+e.wd>=WP.length)e.wd=-e.wd;e.wi+=e.wd}
      else{e.d=Math.sign(dx);e.x+=e.d*SPD}}}
    else{e.x+=.5*e.d;if(e.x<150)e.d=1;if(e.x>260)e.d=-1}
    if(ov(G.x,G.y,PW,PH,e.x,e.y,12,12)){
      if(G.vy>0&&G.pb<=e.y+4){e.hp.takeDamage(30);if(e.hp.isDead())e.alive=false;G.vy=-4}
      else if(G.inv<=0){G.hp.takeDamage(25);G.inv=60;G.vy=-3;if(G.hp.isDead())return die()}
    }
  }
  if(F.scenes&&ov(G.x,G.y,PW,PH,288,136,16,24))G.scene="win";
}
function txt(s,x,y,c){cx.fillStyle="#000";cx.fillText(s,x+1,y+1);cx.fillStyle=c||"#fff";cx.fillText(s,x,y)}
function drawTile(c,r){
  const x=c*T,y=r*T;
  if(!F.tiles){cx.fillStyle="#8a5a2b";cx.fillRect(x,y,T,T);cx.fillStyle="#6b4420";cx.fillRect(x,y,T,1);cx.fillRect(x,y,1,T);return}
  cx.fillStyle="#7a4a22";cx.fillRect(x,y,T,T);
  if((c*7+r*13)%5===0){cx.fillStyle="#5d3a18";cx.fillRect(x+6,y+9,2,2)}
  if(!tile(c-1,r)){cx.fillStyle="#5d3a18";cx.fillRect(x,y,2,T)}
  if(!tile(c+1,r)){cx.fillStyle="#5d3a18";cx.fillRect(x+T-2,y,2,T)}
  if(!tile(c,r-1)){cx.fillStyle="#4caf50";cx.fillRect(x,y,T,4);cx.fillStyle="#8be36b";cx.fillRect(x,y,T,1);
    if(!tile(c-1,r)){cx.fillStyle="#4caf50";cx.fillRect(x,y,2,6)}if(!tile(c+1,r)){cx.fillStyle="#4caf50";cx.fillRect(x+T-2,y,2,6)}}
}
function drawPlayer(){
  if(G.inv>0&&(t>>2)&1)return;
  const x=Math.round(G.x),f=G.face;let y=Math.round(G.y),leg=0;
  if(F.anim){if(G.st==="Run")leg=((t/6)|0)%2?1:2;else if(G.st==="Jump")leg=3;else if(((t/30)|0)%2)y+=1}
  cx.fillStyle="#f2c9a0";cx.fillRect(x+1,y+1,8,6);
  cx.fillStyle="#c0392b";cx.fillRect(x,y,10,3);cx.fillRect(f>0?x+7:x-1,y+2,4,2);
  cx.fillStyle="#111";cx.fillRect(f>0?x+6:x+3,y+4,1,2);
  cx.fillStyle="#2f6fe0";cx.fillRect(x+1,y+7,8,4);
  cx.fillStyle="#222";
  if(leg===0){cx.fillRect(x+1,y+11,3,3);cx.fillRect(x+6,y+11,3,3)}
  else if(leg===1){cx.fillRect(x,y+11,3,3);cx.fillRect(x+6,y+12,3,2)}
  else if(leg===2){cx.fillRect(x+1,y+12,3,2);cx.fillRect(x+7,y+11,3,3)}
  else cx.fillRect(x+2,y+11,6,2);
}
function draw(){
  cx.fillStyle="#5ec8f2";cx.fillRect(0,0,W,H);
  cx.fillStyle="#fff";[[30,20],[150,34],[250,16]].forEach(c=>{cx.fillRect(c[0],c[1],28,6);cx.fillRect(c[0]+6,c[1]-4,16,4)});
  for(let r=0;r<11;r++)for(let c=0;c<20;c++)if(tile(c,r))drawTile(c,r);
  if(F.plat){const p=G.pl;cx.fillStyle="#9aa4bf";cx.fillRect(p.x,144,32,6);cx.fillStyle="#5b6475";cx.fillRect(p.x+3,146,2,2);cx.fillRect(p.x+27,146,2,2)}
  if(F.scenes){cx.fillStyle="#ddd";cx.fillRect(292,136,2,24);cx.fillStyle="#ff2e88";cx.fillRect(294,136,10,7)}
  if(F.coin)G.cs.forEach(c=>{if(!c.on)return;cx.fillStyle="#ffc83d";cx.fillRect(c.x-3,c.y-4,6,8);cx.fillRect(c.x-4,c.y-3,8,6);cx.fillStyle="#fff3b0";cx.fillRect(c.x-2,c.y-3,2,3)});
  if(F.enemy&&G.en.alive){const e=G.en,b=((t/10)|0)%2;cx.fillStyle="#e0344f";cx.fillRect(e.x,e.y+b,12,12-b);cx.fillStyle="#fff";cx.fillRect(e.x+2,e.y+3+b,3,3);cx.fillRect(e.x+7,e.y+3+b,3,3);cx.fillStyle="#111";cx.fillRect(e.x+3+(e.d>0?1:0),e.y+4+b,1,2);cx.fillRect(e.x+8+(e.d>0?1:0),e.y+4+b,1,2)}
  drawPlayer();
  if(show&&L>=1){
    cx.lineWidth=1;cx.strokeStyle="#b6ff3b";
    for(let r=0;r<11;r++)for(let c=0;c<20;c++)if(tile(c,r))cx.strokeRect(c*T+.5,r*T+.5,T-1,T-1);
    if(F.plat)cx.strokeRect(G.pl.x+.5,144.5,31,5);
    cx.strokeStyle="#00e5ff";cx.strokeRect(Math.round(G.x)+.5,Math.round(G.y)+.5,PW-1,PH-1);
    if(F.coin){cx.strokeStyle="#ffc83d";G.cs.forEach(c=>{if(c.on)cx.strokeRect(c.x-3.5,c.y-3.5,7,7)})}
    if(F.enemy&&G.en.alive){cx.strokeStyle="#ff2e88";cx.strokeRect(G.en.x+.5,G.en.y+.5,11,11)}
  }
  cx.font="8px monospace";cx.textBaseline="alphabetic";
  if(F.ai){WP.forEach((x,i)=>{cx.fillStyle=i===G.en.wi?"#ffc83d":"#ff2e88";cx.fillRect(x+3,156,6,4);txt(String(i+1),x+4,153,"#fff")});
    if(G.en.alive&&G.en.wait>0)txt("...",G.en.x+1,G.en.y-2,"#ffc83d")}
  txt("Coins: "+G.coins,4,10);
  if(F.enemy){cx.fillStyle="#000";cx.fillRect(3,14,42,6);cx.fillStyle="#333";cx.fillRect(4,15,40,4);cx.fillStyle=G.hp.pct()>.4?"#b6ff3b":"#ff2e88";cx.fillRect(4,15,Math.round(40*G.hp.pct()),4)}
  if(F.lives){const P=["0110110","1111111","1111111","0111110","0011100","0001000"];for(let i=0;i<3;i++){cx.fillStyle=i<G.lives?"#ff2e88":"#3a2a3a";const ox=W-34+i*10;P.forEach((row,ry)=>{for(let rx=0;rx<7;rx++)if(row[rx]==="1")cx.fillRect(ox+rx,4+ry,1,1)})}}
  if(G.scene!=="play"){
    cx.fillStyle="rgba(11,15,26,.85)";cx.fillRect(0,0,W,H);cx.textAlign="center";
    const a=G.scene==="start"?"PIXEL PLATFORMER":G.scene==="win"?"YOU WIN!":"GAME OVER";
    const b=G.scene==="start"?"Collect coins and reach the flag":"Coins: "+G.coins;
    cx.fillStyle="#fff";cx.font="bold 16px monospace";cx.fillText(a,W/2,70);cx.font="8px monospace";cx.fillText(b,W/2,92);
    cx.fillStyle="#ffc83d";cx.fillRect(W/2-46,106,92,18);cx.fillStyle="#0b0f1a";cx.fillText(G.scene==="start"?"PLAY (Enter)":"AGAIN (Enter)",W/2,118);cx.textAlign="left";
  }
}
function ro(){
  let s="coins="+G.coins;
  if(L>=1)s+="  h="+G.dir+"  grounded="+G.onG+"  canDoubleJump="+(G.jumps===1);
  if(L>=4)s+="  health="+G.hp.cur+"/"+G.hp.max;
  if(L>=5)s+="  parent="+(G.riding&&parent?"MovingPlatform":"none");
  if(L>=6)s+="  lives="+G.lives;
  if(L>=7)s+="  Animator: "+G.st;
  if(L>=8)s+="  enemy="+(G.en.wait>0?"Waiting "+(G.en.wait/60).toFixed(1)+"s":"Moving to waypoint "+(G.en.wi+1));
  if(L>=9)s+="  scene="+G.scene;
  if(s!==lastRO){lastRO=s;$("dv").textContent=s}
}
function setL(i){
  L=i>=10?9:i;
  F={move:L>=1,coin:L>=2,tiles:L>=3,enemy:L>=4,plat:L>=5,pit:L>=5,lives:L>=6,anim:L>=7,ai:L>=8,scenes:L>=9};
  $("dn").textContent="New in this step: "+NEW[L]+" (The preview restarts on each step.)";
  $("dpw").hidden=!F.plat;$("daw").hidden=L<8;$("dcw").hidden=L<1;
  reset();lastRO="";
}
window.demoSet=setL;
function startPlay(){if(G.scene!=="play"){reset();G.scene="play"}}
const K={ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right",Shift:"run"},J=[" ","ArrowUp","w","W"];
cv.addEventListener("keydown",e=>{
  if(K[e.key]){keys[K[e.key]]=1;e.preventDefault()}
  else if(J.includes(e.key)){if(!e.repeat)jq=true;e.preventDefault()}
  else if(e.key==="Enter"){startPlay();e.preventDefault()}
});
cv.addEventListener("keyup",e=>{if(K[e.key])keys[K[e.key]]=0});
cv.addEventListener("blur",()=>{keys.left=keys.right=keys.run=0});
cv.addEventListener("pointerdown",()=>{cv.focus();startPlay()});
document.querySelectorAll("#demo [data-gk]").forEach(b=>{
  const k=b.dataset.gk;
  if(k==="run"){b.onclick=()=>{keys.run=keys.run?0:1;b.setAttribute("aria-pressed",!!keys.run)};return}
  if(k==="jump"){b.onpointerdown=e=>{e.preventDefault();jq=true};b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();jq=true}};return}
  const on=e=>{e.preventDefault();keys[k]=1},off=()=>{keys[k]=0};
  b.onpointerdown=on;b.onpointerup=off;b.onpointerleave=off;b.onpointercancel=off;
  b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();keys[k]=1}};b.onkeyup=e=>{if(e.key==="Enter"||e.key===" ")keys[k]=0};
});
$("drs").onclick=()=>{reset();if(F.scenes)G.scene="play";lastRO=""};
$("dps").onclick=function(){paused=!paused;this.setAttribute("aria-pressed",paused);this.querySelector("span").textContent=paused?"Resume":"Pause"};
$("dc").onchange=function(){show=this.checked};
$("dp").onchange=function(){parent=this.checked};
$("dww").oninput=function(){WAIT=+this.value;$("dwo").textContent=WAIT+"s"};
$("dws").oninput=function(){SPD=+this.value;$("dso").textContent=SPD};
let last=0,acc=0;
function loop(ts){
  if(!last)last=ts;acc+=Math.min(ts-last,100);last=ts;
  if(!paused){while(acc>=16.667){step();acc-=16.667}}else acc=0;
  draw();if(t%6===0||paused)ro();
  requestAnimationFrame(loop);
}
setL(0);requestAnimationFrame(loop);
})();
</script>
