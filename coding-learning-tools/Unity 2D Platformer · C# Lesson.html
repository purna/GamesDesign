const CODE={
patrol:`using UnityEngine;
using System.Collections;

public class EnemyPatrol : MonoBehaviour
{
    public Transform[] waypoints;   // drag empty objects in, in order
    public float speed = 2f;
    public float waitTime = 1f;     // pause at each waypoint

    int index = 0;
    int direction = 1;              // 1 = forward, -1 = back
    bool waiting;
    SpriteRenderer sr;

    void Awake() { sr = GetComponent<SpriteRenderer>(); }

    void Update()
    {
        if (waiting) return;

        Vector2 target = new Vector2(waypoints[index].position.x, transform.position.y);
        sr.flipX = target.x < transform.position.x;   // face the way we walk
        transform.position = Vector2.MoveTowards(
            transform.position, target, speed * Time.deltaTime);

        if (Mathf.Abs(transform.position.x - target.x) < 0.05f)
            StartCoroutine(WaitThenNext());
    }

    IEnumerator WaitThenNext()
    {
        waiting = true;
        yield return new WaitForSeconds(waitTime);

        if (index + direction < 0 || index + direction >= waypoints.Length)
            direction = -direction;   // turn around at either end
        index += direction;
        waiting = false;
    }
}`,
pat2:`// Timer version: no coroutine needed
float waitTimer;

void Update()
{
    if (waitTimer > 0)            // still pausing
    {
        waitTimer -= Time.deltaTime;
        return;
    }

    // ...move towards waypoints[index] as before...

    if (arrived)
    {
        waitTimer = waitTime;     // start the pause
        NextWaypoint();           // same ping-pong code as above
    }
}`,

using UnityEngine.SceneManagement;
using TMPro;

public class GameManager : MonoBehaviour

    public static GameManager Instance;   // singleton

    void Awake() { Instance = this; }

    public void AddCoin(int amount = 1)
    {
        coins += amount;
        coinText.text = "Coins: " + coins;
    }
}`,
old:`using UnityEngine;

public class PlayerMovement : MonoBehaviour
{
    public float walkSpeed = 5f, runSpeed = 8f, jumpForce = 10f;
    public Rigidbody2D rb;
    public SpriteRenderer sr;
    public Transform groundCheck;
    public float checkRadius = 0.2f;
    public LayerMask groundLayer;

    float h;
    bool grounded, canDoubleJump;

    void Update()
    {
        h = Input.GetAxisRaw("Horizontal");
        if (h != 0) sr.flipX = h < 0;
        grounded = Physics2D.OverlapCircle(
            groundCheck.position, checkRadius, groundLayer);

        if (Input.GetButtonDown("Jump"))
        {
            if (grounded) { Jump(); canDoubleJump = true; }
            else if (canDoubleJump) { Jump(); canDoubleJump = false; }
        }
    }

    void FixedUpdate()
    {
        float speed = Input.GetKey(KeyCode.LeftShift) ? runSpeed : walkSpeed;
        rb.velocity = new Vector2(h * speed, rb.velocity.y);
    }

    void Jump() { rb.velocity = new Vector2(rb.velocity.x, jumpForce); }
}`,

    public Transform groundCheck;
    public float checkRadius = 0.2f;
    public LayerMask groundLayer;
    // Drag actions in from your Input Actions asset
    public InputActionReference moveAction, jumpAction, runAction;

    float h;
    bool grounded, canDoubleJump;

    void OnEnable()
    {
        moveAction.action.Enable();
        runAction.action.Enable();
        jumpAction.action.Enable();
        jumpAction.action.performed += OnJump;
    }
    void OnDisable() { jumpAction.action.performed -= OnJump; }

    void Update()
    {
        h = moveAction.action.ReadValue<Vector2>().x;
        if (h != 0) sr.flipX = h < 0;
        grounded = Physics2D.OverlapCircle(
            groundCheck.position, checkRadius, groundLayer);
    }

    void OnJump(InputAction.CallbackContext ctx)
    {
        if (grounded) { Jump(); canDoubleJump = true; }
        else if (canDoubleJump) { Jump(); canDoubleJump = false; }
    }

    void FixedUpdate()
    {
        float speed = runAction.action.IsPressed() ? runSpeed : walkSpeed;
        rb.velocity = new Vector2(h * speed, rb.velocity.y);
    }

    void Jump() { rb.velocity = new Vector2(rb.velocity.x, jumpForce); }
}`,

{
    int maxHealth;
    int currentHealth;

    public HealthSystem(int max)          // constructor
    {
        maxHealth = max;
        currentHealth = max;
    }

    public void TakeDamage(int amount)
    {
        currentHealth -= amount;
        if (currentHealth < 0) currentHealth = 0;
    }

    public void Heal(int amount)
    {
        currentHealth += amount;
        if (currentHealth > maxHealth) currentHealth = maxHealth;
    }

    public int GetHealth() { return currentHealth; }
    public bool IsDead() { return currentHealth <= 0; }
    public float GetHealthPercent() { return (float)currentHealth / maxHealth; }
}`,

public class MovingPlatform : MonoBehaviour
{
    public Transform pointA, pointB;   // NOT children of the platform
    public float speed = 2f;
    Vector3 target;

    void Start() { target = pointB.position; }

    void Update()
    {
        transform.position = Vector3.MoveTowards(
            transform.position, target, speed * Time.deltaTime);
        if (Vector3.Distance(transform.position, target) < 0.05f)
            target = (target == pointA.position) ? pointB.position : pointA.position;
    }

    void OnCollisionEnter2D(Collision2D col)
    {
        if (col.gameObject.CompareTag("Player"))
            col.transform.SetParent(transform);   // ride along
    }

    void OnCollisionExit2D(Collision2D col)
    {
        if (col.gameObject.CompareTag("Player"))
            col.transform.SetParent(null);        // let go
    }
}`,

  r.onerror=e=>say(e.error==="not-allowed"||e.error==="service-not-allowed"?"The microphone is blocked here. Allow it in your browser settings, or use the microphone key on your keyboard.":e.error==="no-speech"?"I did not hear anything. Tap Dictate and try again.":"Dictation stopped ("+e.error+").");

function model(){

    sections:TABS.map((t,ti)=>{const rows=t.fields.map(f=>[f.label,g(f.k)||"(empty)"]);
      if(t.task){const d=t.task.filter((x,j)=>data["c"+ti+"_"+j]).length;rows.unshift(["Tasks completed",d+" of "+t.task.length])}

}

const fileName=ext=>`${CFG.file}-${stamp()}.${ext}`;
function md(){const m=model();return "# "+m.title+"\n\n"+m.sections.map(s=>"## "+s.h+"\n\n"+s.rows.map(r=>"**"+r[0]+"**\n\n"+r[1]).join("\n\n")).join("\n\n")+"\n"}

function csv(){const m=model(),o=[["Section","Field","Value"].map(cell).join(",")];m.sections.forEach(s=>s.rows.forEach(r=>o.push([s.h,r[0],r[1]].map(cell).join(","))));return "\uFEFF"+o.join("\r\n")+"\r\n"}
const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

    h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,name.length,true);
    parts.push(h.buffer,name,d);

    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);

function pdf(){

  try{const b=body instanceof Blob?body:new Blob([body],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);say("Saved "+name);
  }catch(e){say("This view could not save the file.")}

  if(!started())return say("Nothing to back up yet.");
  save(`${CFG.file}-backup-${stamp()}.json`,new Blob([JSON.stringify({app:CFG.pfx,version:CFG.version,saved:new Date().toISOString(),data,prefs:{theme,font:fp,dys}},null,2)],{type:"application/json;charset=utf-8"}));
}
const okKey=k=>FIELDS.some(f=>f.k===k)||/^c\d+_\d+$/.test(k);
function importBackup(f){
  if(!f)return;
  if(f.size>2e6)return say("That file is too large to be a backup.");
  const r=new FileReader();r.onerror=()=>say("That file could not be read.");
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||d.app!==CFG.pfx||typeof d.data!=="object")throw 0;
      if(d.version>CFG.version)return say("That backup is from a newer version of this app.");
      if(started()&&!confirm("Replace what is on this device with the backup?"))return say("Import cancelled. Nothing changed.");
      data={};Object.keys(d.data).forEach(k=>{if(okKey(k)&&typeof d.data[k]==="string")data[k]=d.data[k].slice(0,5000)});
      persist();drawPanel();say("Backup imported.");
    }catch(e){say("That does not look like a backup from this app.")}
  };
  r.readAsText(f);
}

  $("mo").innerHTML=EXPORTS.map(x=>`<button type="button" class="alt opt" id="x-${x.id}">${ic(x.ic,x.fb)}<span>${esc(x.label)}<small>${esc(x.desc)}</small></span></button>`).join("");
  EXPORTS.forEach(x=>$("x-"+x.id).onclick=()=>{closeM();runExport(x)});
  $("xopen").onclick=openM;$("xcl").onclick=closeM;$("xcp").onclick=copyText;$("xpr").onclick=()=>window.print();
  $("bks").onclick=()=>{closeM();backup()};$("bki").onclick=()=>$("bkf").click();
  $("bkf").onchange=function(){closeM();importBackup(this.files[0]);this.value=""};

  $("al-ap").onclick=()=>{const n=$("al-pn").value.trim(),t=$("al-pt").value;if(!n)return say("Type a parameter name first.");if(find(n))return say("That parameter already exists.");A.params.push({n,t});A.val[n]=t==="f"||t==="i"?0:false;render();say("Added "+TY[t]+" parameter "+n)};
  $("al-as").onclick=()=>{const n=$("al-ns").value.trim();if(!n||A.states.includes(n)||n==="Any State")return say("Type a new, unused state name.");A.states.push(n);render();say("Added state "+n)};
  $("al-at").onclick=()=>{const p=find($("al-p").value),f=$("al-f").value,to=$("al-t").value;if(!p)return say("Add a parameter first.");if(f===to)return say("Choose two different states.");
    A.tr.push({f,to,p:p.n,op:p.t==="t"?"set":$("al-o").value,v:+$("al-v").value});render();say("Added transition "+f+" to "+to)};
  r.querySelectorAll("[data-rp]").forEach(e=>e.onclick=()=>{const n=e.dataset.rp;A.params=A.params.filter(p=>p.n!==n);delete A.val[n];A.tr=A.tr.filter(x=>x.p!==n);render();say("Removed "+n)});
  r.querySelectorAll("[data-rt]").forEach(e=>e.onclick=()=>{A.tr.splice(+e.dataset.rt,1);render();say("Transition removed")});
  r.querySelectorAll("[data-pv]").forEach(e=>e.oninput=()=>{const p=find(e.dataset.pv);A.val[p.n]=p.t==="b"?e.checked:+e.value;const o=e.nextElementSibling;if(o&&o.tagName==="OUTPUT")o.textContent=e.value;evalA();refresh()});
  r.querySelectorAll("[data-pt]").forEach(e=>e.onclick=()=>{A.val[e.dataset.pt]=true;evalA();refresh();say("Trigger set")});
  $("al-ex").onclick=()=>{A.states=["Idle","Run","Jump"];A.params=[{n:"Speed",t:"f"},{n:"IsGrounded",t:"b"}];A.val={Speed:0,IsGrounded:true};A.cur="Idle";
    A.tr=[{f:"Idle",to:"Run",p:"Speed",op:">",v:.1},{f:"Run",to:"Idle",p:"Speed",op:"<",v:.1},{f:"Any State",to:"Jump",p:"IsGrounded",op:"false",v:0},{f:"Jump",to:"Idle",p:"IsGrounded",op:"true",v:0}];render();say("Example loaded")};
  $("al-cl").onclick=()=>{A.params=[];A.tr=[];A.val={};A.cur="Idle";render();say("Cleared")};
  $("al-ck").onclick=check;
  refresh();
}
function tick(){if(!$("al")){clearInterval(A.tm);A.tm=null;return}A.fr+=6;evalA();refresh()}
window.animLab=()=>{render();if(!A.tm)A.tm=setInterval(tick,100)};
})();
</script>
</body>
</html>
