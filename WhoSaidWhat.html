<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who Said What? - Class Icebreaker</title>
  <!-- Party.js Library for Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/party-js@latest/bundle/party.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    h1, h2, h3 { text-align: center; color: #333; margin-top: 0; }
    .hidden { display: none; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; }
    button { background: #4F46E5; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #4338CA; }
    button:disabled { background: #A5B4FC; cursor: not-allowed; }
    .option-btn { background: #E0E7FF; color: #3730A3; border: 2px solid #C7D2FE; margin: 6px 0; }
    .option-btn:hover { background: #C7D2FE; }
    .player-list { list-style: none; padding: 0; }
    .player-list li { background: #F3F4F6; padding: 10px; margin: 6px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .badge { font-size: 12px; padding: 4px 8px; border-radius: 12px; font-weight: bold; }
    .badge-host { background: #E0E7FF; color: #3730A3; }
    .info-text { text-align: center; font-size: 14px; color: #666; }

    /* TOTP Container & Radial Timer Styles */
    .totp-box { background: #EEF2FF; border: 2px dashed #6366F1; padding: 16px; border-radius: 8px; text-align: center; margin-bottom: 12px; display: flex; flex-direction: column; align-items: center; }
    .totp-code { font-size: 26px; font-weight: bold; letter-spacing: 4px; color: #4F46E5; margin-top: 4px; }
    
    .base-timer { position: relative; width: 100px; height: 100px; margin-top: 10px; }
    .base-timer__svg { transform: scaleX(-1); }
    .base-timer__circle { fill: none; stroke: none; }
    .base-timer__path-elapsed { stroke-width: 7px; stroke: #C7D2FE; }
    .base-timer__path-remaining {
      stroke-width: 7px;
      stroke-linecap: round;
      transform: rotate(90deg);
      transform-origin: center;
      transition: 1s linear all;
      fill-rule: nonzero;
      stroke: currentColor;
    }
    .base-timer__path-remaining.green { color: rgb(65, 184, 131); }
    .base-timer__path-remaining.orange { color: orange; }
    .base-timer__path-remaining.red { color: red; }
    .base-timer__label {
      position: absolute; width: 100px; height: 100px; top: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: bold; color: #3730A3;
    }

    /* Breakdown / Review Styles */
    .review-card { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 8px; padding: 12px; margin-bottom: 12px; text-align: left; }
    .review-item { display: flex; justify-content: space-between; margin: 4px 0; font-size: 14px; border-bottom: 1px dashed #E5E7EB; padding-bottom: 4px; }
    .correct { color: #059669; font-weight: bold; }
    .incorrect { color: #DC2626; font-weight: bold; }

    /* Podium Leaderboard Styles */
    .podium-container { display: flex; justify-content: center; align-items: flex-end; height: 160px; margin: 20px 0; }
    .podium-step { width: 30%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; border-radius: 8px 8px 0 0; color: white; font-weight: bold; transition: height 0.5s ease; }
    .podium-1 { height: 100%; background: #FBBF24; order: 2; box-shadow: 0 4px 10px rgba(251, 191, 36, 0.4); }
    .podium-2 { height: 75%; background: #9CA3AF; order: 1; box-shadow: 0 4px 10px rgba(156, 163, 175, 0.4); }
    .podium-3 { height: 50%; background: #D97706; order: 3; box-shadow: 0 4px 10px rgba(217, 119, 6, 0.4); }
    .podium-name { font-size: 13px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 90%; margin-bottom: 4px; }
    .podium-score { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
    .podium-rank { font-size: 22px; font-weight: 900; opacity: 0.8; margin-bottom: 4px; }
  </style>

  <script type="module">
    import { joinRoom } from 'https://esm.sh/trystero@0.22.0/nostr';

    const MIN_PLAYERS = 2;
    const MAX_PLAYERS = 10;
    const TIME_LIMIT = 60;
    const FULL_DASH_ARRAY = 283;
    const WARNING_THRESHOLD = 15;
    const ALERT_THRESHOLD = 5;

    const QUESTIONS = [
      { q: "1. Preferred Study Environment?", opts: ["Quiet Library", "Bustling Cafe", "Bed with Music", "Outdoors"] },
      { q: "2. Ultimate Snack?", opts: ["Salty / Chips", "Sweet / Candy", "Fruit / Healthy", "Pastries"] },
      { q: "3. Ideal Superpower?", opts: ["Invisibility", "Flight", "Teleportation", "Mind Reading"] },
      { q: "4. Morning or Night?", opts: ["Early Bird", "Night Owl", "Permanently Tired"] },
      { q: "5. Favorite Pet?", opts: ["Dogs", "Cats", "Reptiles/Fish", "No Pets"] },
      { q: "6. Dream Vacation?", opts: ["Tropical Beach", "Historic City", "Mountain Camping", "Amusement Park"] },
      { q: "7. Media Choice?", opts: ["Video Games", "Movies / Shows", "Books / Audiobooks", "Social Media"] },
      { q: "8. Productivity Style?", opts: ["Plan Weeks Ahead", "Burst at Deadline", "Steady Daily Progress"] },
      { q: "9. Go-to Drink?", opts: ["Coffee", "Tea", "Boba / Smoothies", "Water"] },
      { q: "10. In a Group Project, you are the:", opts: ["Leader", "Researcher", "Presenter", "Designer"] }
    ];

    let room, sendAnswers, sendAnnounce, sendStartGame, sendReject, sendMyScore;
    let myName = "", myAnswers = [], peerData = {}, myGuesses = {};
    let isHost = false, hasJoined = false, joinedRoomCode = "";
    let finalScores = {};
    let confettiTriggered = false;

    function generateDynamicCode() {
      const epochMinute = Math.floor(Date.now() / 60000);
      const hash = Math.sin(epochMinute) * 1000000;
      return Math.abs(Math.floor(hash)).toString(36).substring(0, 6).toUpperCase().padStart(6, 'X');
    }

    function updateTotpUI() {
      if (hasJoined) return;
      const currentCode = generateDynamicCode();
      const secondsLeft = TIME_LIMIT - (Math.floor(Date.now() / 1000) % TIME_LIMIT);
      
      document.getElementById('roomcode').value = currentCode;
      document.getElementById('totp-display').innerText = currentCode;
      document.getElementById('base-timer-label').innerText = `${secondsLeft}s`;

      setCircleDasharray(secondsLeft);
      setRemainingPathColor(secondsLeft);
    }

    function setRemainingPathColor(timeLeft) {
      const path = document.getElementById("base-timer-path-remaining");
      if (!path) return;
      path.classList.remove("green", "orange", "red");
      if (timeLeft <= ALERT_THRESHOLD) path.classList.add("red");
      else if (timeLeft <= WARNING_THRESHOLD) path.classList.add("orange");
      else path.classList.add("green");
    }

    function setCircleDasharray(timeLeft) {
      const path = document.getElementById("base-timer-path-remaining");
      if (!path) return;
      const rawTimeFraction = timeLeft / TIME_LIMIT;
      const timeFraction = rawTimeFraction - (1 / TIME_LIMIT) * (1 - rawTimeFraction);
      path.setAttribute("stroke-dasharray", `${(timeFraction * FULL_DASH_ARRAY).toFixed(0)} 283`);
    }

    setInterval(updateTotpUI, 1000);
    updateTotpUI();

    document.getElementById('btn-join').onclick = () => {
      myName = document.getElementById('username').value.trim();
      joinedRoomCode = document.getElementById('roomcode').value.trim().toLowerCase();
      
      if (!myName || !joinedRoomCode) return alert("Please enter both a name and room code!");

      room = joinRoom(
        { appId: 'classroom-icebreaker-2026', password: joinedRoomCode, relayUrls: ['wss://relay.damus.io', 'wss://nos.lol'] }, 
        joinedRoomCode
      );
      
      const [makeSendAnswers, getAnswers] = room.makeAction('answers');
      const [makeSendAnnounce, getAnnounce] = room.makeAction('announce');
      const [makeSendStart, getStart] = room.makeAction('start');
      const [makeSendReject, getReject] = room.makeAction('reject');
      const [makeSendScore, getScore] = room.makeAction('score');

      sendAnswers = makeSendAnswers;
      sendAnnounce = makeSendAnnounce;
      sendStartGame = makeSendStart;
      sendReject = makeSendReject;
      sendMyScore = makeSendScore;

      hasJoined = true;

      room.onPeerLeave(peerId => {
        delete peerData[peerId];
        updateLobby();

        const activePeers = Object.keys(peerData);
        const hostExists = activePeers.some(id => peerData[id].isHost);
        if (!hostExists && activePeers.length > 0) {
          activePeers.sort();
          if (activePeers[0] === 'me') {
            isHost = true;
            sendAnnounce({ name: myName, isHost: true });
          }
        }

        const screenSetup = document.getElementById('screen-setup');
        if (!screenSetup.classList.contains('hidden')) checkAllAnswersIn();
      });

      room.onPeerJoin(peerId => {
        const currentCount = Object.keys(peerData).length + 1;
        if (isHost && currentCount > MAX_PLAYERS) {
          sendReject({ reason: `Room is full! Maximum limit is ${MAX_PLAYERS} players.` });
          return;
        }
        sendAnnounce({ name: myName, isHost });
        updateLobby();
      });

      getReject((data) => {
        alert(data.reason);
        location.reload();
      });

      getAnnounce((data, peerId) => {
        peerData[peerId] = peerData[peerId] || {};
        peerData[peerId].name = data.name;
        peerData[peerId].isHost = data.isHost;
        updateLobby();
      });

      getStart(() => {
        document.getElementById('screen-lobby').classList.add('hidden');
        document.getElementById('screen-setup').classList.remove('hidden');
        renderSetupQuestion(0);
      });

      getAnswers((data, peerId) => {
        if (peerData[peerId]) {
          peerData[peerId].answers = data.answers;
          checkAllAnswersIn();
        }
      });

      getScore((data, peerId) => {
        finalScores[data.name] = data.score;
        checkLeaderboardReady();
      });

      setTimeout(() => {
        const activePeers = Object.keys(peerData);
        if (activePeers.length === 0) isHost = true;
        sendAnnounce({ name: myName, isHost });
        updateLobby();
      }, 1000);

      document.getElementById('screen-join').classList.add('hidden');
      document.getElementById('screen-lobby').classList.remove('hidden');
      updateLobby();
    };

    function updateLobby() {
      const list = document.getElementById('player-list');
      const hostTag = isHost ? '<span class="badge badge-host">HOST</span>' : '';
      list.innerHTML = `<li><span><strong>${myName} (You)</strong></span> ${hostTag}</li>`;
      
      const activePeers = Object.keys(peerData);
      activePeers.forEach(id => {
        if (peerData[id] && peerData[id].name) {
          const peerHostTag = peerData[id].isHost ? '<span class="badge badge-host">HOST</span>' : '';
          list.innerHTML += `<li><span>${peerData[id].name}</span> ${peerHostTag}</li>`;
        }
      });

      const totalPlayers = activePeers.length + 1;
      const btnStart = document.getElementById('btn-start-setup');
      const playerStatusText = document.getElementById('player-status-text');

      if (totalPlayers < MIN_PLAYERS) {
        btnStart.disabled = true;
        playerStatusText.innerText = `Waiting for players... Need at least ${MIN_PLAYERS} to start (${totalPlayers}/${MAX_PLAYERS})`;
      } else {
        btnStart.disabled = !isHost;
        playerStatusText.innerText = isHost 
          ? `${totalPlayers}/${MAX_PLAYERS} players connected. Click Start Game!` 
          : `${totalPlayers}/${MAX_PLAYERS} players connected. Waiting for Host to start...`;
      }
    }

    document.getElementById('btn-start-setup').onclick = () => {
      sendStartGame({});
      document.getElementById('screen-lobby').classList.add('hidden');
      document.getElementById('screen-setup').classList.remove('hidden');
      renderSetupQuestion(0);
    };

    function renderSetupQuestion(idx) {
      const screenSetup = document.getElementById('screen-setup');
      if (idx >= QUESTIONS.length) {
        peerData['me'] = { name: myName, answers: myAnswers, isHost };
        sendAnswers({ answers: myAnswers });
        screenSetup.innerHTML = `<h2>Answers Submitted!</h2><p class="info-text">Waiting for remaining active players...</p>`;
        checkAllAnswersIn();
        return;
      }

      const q = QUESTIONS[idx];
      let html = `<h2>Question ${idx + 1}/10</h2><p><strong>${q.q}</strong></p>`;
      q.opts.forEach((opt, i) => {
        html += `<button class="option-btn" onclick="selectAnswer(${idx}, ${i})">${opt}</button>`;
      });
      screenSetup.innerHTML = html;
    }

    window.selectAnswer = (qIdx, optIdx) => {
      myAnswers[qIdx] = optIdx;
      renderSetupQuestion(qIdx + 1);
    };

    function checkAllAnswersIn() {
      const activePeers = Object.keys(peerData).filter(id => id !== 'me');
      if (activePeers.length === 0 && myAnswers.length === 10) {
        startGuessingPhase();
        return;
      }
      const allPeersAnswered = activePeers.every(id => peerData[id] && peerData[id].answers);
      if (allPeersAnswered && myAnswers.length === 10) {
        startGuessingPhase();
      }
    }

    function startGuessingPhase() {
      document.getElementById('screen-setup').classList.add('hidden');
      document.getElementById('screen-guess').classList.remove('hidden');
      runGuessingForPlayer(0);
    }

    function runGuessingForPlayer(peerIndex) {
      const otherPeerIds = Object.keys(peerData).filter(id => id !== 'me');
      if (peerIndex >= otherPeerIds.length) {
        calculateAndShowBreakdown();
        return;
      }

      const targetId = otherPeerIds[peerIndex];
      const targetName = peerData[targetId].name;
      myGuesses[targetId] = myGuesses[targetId] || [];
      renderGuessQuestion(peerIndex, targetId, targetName, 0);
    }

    function renderGuessQuestion(peerIndex, targetId, targetName, qIdx) {
      if (!peerData[targetId]) {
        runGuessingForPlayer(peerIndex + 1);
        return;
      }

      if (qIdx >= QUESTIONS.length) {
        runGuessingForPlayer(peerIndex + 1);
        return;
      }

      const q = QUESTIONS[qIdx];
      let html = `<h2>Guessing for: <span style="color:#4F46E5">${targetName}</span></h2>
                  <p><strong>${q.q}</strong></p>`;
      
      q.opts.forEach((opt, i) => {
        html += `<button class="option-btn" onclick="makeGuess('${targetId}', ${peerIndex}, ${qIdx}, ${i})">${opt}</button>`;
      });
      document.getElementById('screen-guess').innerHTML = html;
    }

    window.makeGuess = (targetId, peerIndex, qIdx, optIdx) => {
      myGuesses[targetId][qIdx] = optIdx;
      const targetName = peerData[targetId] ? peerData[targetId].name : "Player";
      renderGuessQuestion(peerIndex, targetId, targetName, qIdx + 1);
    };

    function calculateAndShowBreakdown() {
      let myTotalScore = 0;
      let reviewHtml = `<h2>Your Score Breakdown</h2>`;
      const otherPeerIds = Object.keys(peerData).filter(id => id !== 'me');

      otherPeerIds.forEach(targetId => {
        const peer = peerData[targetId];
        if (!peer || !peer.answers) return;

        let peerCorrectCount = 0;
        let itemDetails = '';

        QUESTIONS.forEach((q, qIdx) => {
          const actualOptIdx = peer.answers[qIdx];
          const myGuessOptIdx = myGuesses[targetId][qIdx];
          const isCorrect = actualOptIdx === myGuessOptIdx;

          if (isCorrect) peerCorrectCount++;

          const actualText = q.opts[actualOptIdx];
          const guessText = q.opts[myGuessOptIdx];

          itemDetails += `
            <div class="review-item">
              <div>
                <strong>Q${qIdx + 1}:</strong> Chosen: <em>${actualText}</em><br>
                <small>Your Guess: ${guessText}</small>
              </div>
              <div class="${isCorrect ? 'correct' : 'incorrect'}">
                ${isCorrect ? '✓ +1' : '✗ 0'}
              </div>
            </div>`;
        });

        myTotalScore += peerCorrectCount;
        reviewHtml += `
          <div class="review-card">
            <h3>Guesses for ${peer.name} (${peerCorrectCount}/10)</h3>
            ${itemDetails}
          </div>`;
      });

      reviewHtml = `<h3>Total Score: ${myTotalScore} Points</h3>` + reviewHtml;
      reviewHtml += `<button id="btn-show-leaderboard">View Leaderboard</button>`;

      const screenBreakdown = document.getElementById('screen-breakdown');
      document.getElementById('screen-guess').classList.add('hidden');
      screenBreakdown.classList.remove('hidden');
      screenBreakdown.innerHTML = reviewHtml;

      finalScores[myName] = myTotalScore;
      sendMyScore({ name: myName, score: myTotalScore });

      document.getElementById('btn-show-leaderboard').onclick = () => {
        screenBreakdown.classList.add('hidden');
        document.getElementById('screen-results').classList.remove('hidden');
        renderLeaderboardUI();
      };
    }

    function checkLeaderboardReady() {
      const screenResults = document.getElementById('screen-results');
      if (!screenResults.classList.contains('hidden')) {
        renderLeaderboardUI();
      }
    }

    function renderLeaderboardUI() {
      const sortedScores = Object.entries(finalScores).sort((a, b) => b[1] - a[1]);
      const screenResults = document.getElementById('screen-results');

      const first = sortedScores[0] || ["-", 0];
      const second = sortedScores[1] || ["-", 0];
      const third = sortedScores[2] || ["-", 0];

      let html = `<h2>Final Leaderboard</h2>
        <div class="podium-container">
          <div class="podium-step podium-2">
            <span class="podium-name">${second[0]}</span>
            <span class="podium-score">${second[1]}</span>
            <span class="podium-rank">2</span>
          </div>
          <div class="podium-step podium-1" id="winner-podium">
            <span class="podium-name">${first[0]}</span>
            <span class="podium-score">${first[1]}</span>
            <span class="podium-rank">1</span>
          </div>
          <div class="podium-step podium-3">
            <span class="podium-name">${third[0]}</span>
            <span class="podium-score">${third[1]}</span>
            <span class="podium-rank">3</span>
          </div>
        </div>
        <ul class="player-list">`;

      sortedScores.slice(3).forEach(([name, score], rank) => {
        html += `<li><span><strong>#${rank + 4} ${name}</strong></span> <span>${score} pts</span></li>`;
      });

      html += `</ul><button onclick="location.reload()">Play Again</button>`;
      screenResults.innerHTML = html;

      // Trigger Party.js Confetti Explosion for 1st Place
      if (!confettiTriggered && window.party) {
        confettiTriggered = true;
        setTimeout(() => {
          const winnerElem = document.getElementById('winner-podium');
          if (winnerElem) {
            party.confetti(winnerElem, {
              count: party.variation.range(40, 60),
              spread: party.variation.range(40, 80)
            });
          }
        }, 100);
      }
    }
  </script>
</head>
<body>
  <div class="card">
    <div id="screen-join">
      <h1>Who Said What?</h1>
      <div class="totp-box">
        <div style="font-size: 11px; text-transform: uppercase; color: #6B7280; font-weight: bold;">Current Room Passcode</div>
        <div class="totp-code" id="totp-display">------</div>
        
        <div class="base-timer">
          <svg class="base-timer__svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <g class="base-timer__circle">
              <circle class="base-timer__path-elapsed" cx="50" cy="50" r="45"></circle>
              <path
                id="base-timer-path-remaining"
                stroke-dasharray="283"
                class="base-timer__path-remaining green"
                d="
                  M 50, 50
                  m -45, 0
                  a 45,45 0 1,0 90,0
                  a 45,45 0 1,0 -90,0
                "
              ></path>
            </g>
          </svg>
          <span id="base-timer-label" class="base-timer__label">60s</span>
        </div>
      </div>

      <input type="text" id="username" placeholder="Enter Your Name" maxlength="15">
      <input type="text" id="roomcode" placeholder="Room Code">
      <button id="btn-join">Join Room</button>
    </div>

    <div id="screen-lobby" class="hidden">
      <h2>Classroom Lobby</h2>
      <p id="player-status-text" class="info-text">Waiting for players...</p>
      <ul id="player-list" class="player-list"></ul>
      <button id="btn-start-setup" disabled>Start Game</button>
    </div>

    <div id="screen-setup" class="hidden"></div>
    <div id="screen-guess" class="hidden"></div>
    <div id="screen-breakdown" class="hidden"></div>
    <div id="screen-results" class="hidden"></div>
  </div>
</body>
</html>
