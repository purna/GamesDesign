<!DOCTYPE html>
<html lang="en">
<!--
================================================================================
 PIXELAGENT WEB APP TEMPLATE  -  SOURCE OF TRUTH  (v1.1)
================================================================================
 Distilled from: Spot the Bug, Idea Lab, Map It Out, Refinement Sprint.
 Single self-contained .html file. No build step. No framework. Vanilla JS.

 HOW TO START A NEW APP
   1. Copy this file. Edit CFG (name, file prefix, storage prefix, version).
   2. Replace APP_TABS (the content). Each field is {k,label,hint,rows?}.
      The Reflect tab (What? So What? Now What?) is appended for you.
      Tabs, panels, dictation, read-aloud, saving and ALL exports follow
      automatically from TABS via model(). Do not hand-write them per app.
   3. Add custom widgets only inside drawPanel() hooks, then re-run the
      CHECKLIST below before shipping.
   4. Never delete a [MUST] item. Extend it, never fork it.

 MINIMUM REQUIREMENTS CHECKLIST            ([MUST] = ship blocker)
 PEDAGOGY
   [MUST] REFLECT-1 Every learner-facing app ends with the Reflect tab: What?
                  So What? Now What? (Borton, 1970), the same exit task used in
                  the presentation template. It is appended from REFLECT, so do
                  not remove, rename or reorder it. Wording, order and colours
                  (cyan, pink, lime) must match the slides. Reserved keys:
                  ref_what, ref_sowhat, ref_nowwhat. It is exported like any
                  other tab because it lives in TABS.
   [MUST] REFLECT-2 Each reflection box offers tap-to-insert sentence
                  starters (field.starters) in a labelled select list above the
                  box. Choosing one APPENDS it after whatever is already written
                  (never overwrites), moves focus to the box and announces it.
                  Keyboard: arrows browse, Enter adds (arrowing must not insert).
                  Keep the stems in the hints too. Aim: 1-3 sentences per
                  question, 5-10 minutes.
   [SHOULD] STARTER-1 Any long-answer field in any tab may set `starters`;
                  keep each under ~40 characters and write them as openers.
 ACCESSIBILITY
   [MUST] A11Y-1  Skip link to #main; <html lang> set; one <h1>.
   [MUST] A11Y-2  Toolbar at top: Day / Night / Contrast themes, A- / A+
                  text size (90-130%), Dyslexic font. All persisted.
                  First visit follows prefers-color-scheme.
   [MUST] A11Y-3  WCAG AA contrast in all 3 themes (ratios noted at :root).
                  Colour never the only signal (use text / tick marks).
   [MUST] A11Y-4  Visible :focus-visible outline on every control.
   [MUST] A11Y-5  Every input has a real <label for>, a hint wired with
                  aria-describedby. Placeholder is never the label.
   [MUST] A11Y-6  say() live region announces saves, errors, mode changes.
   [MUST] A11Y-7  Tabs: role=tablist/tab/tabpanel, aria-selected, roving
                  tabindex, Left/Right/Home/End keys.
   [MUST] A11Y-8  Modals: role=dialog aria-modal, labelled+described, focus
                  moves in, Tab is trapped, background inert, Esc closes,
                  focus returns to the opener.
   [MUST] A11Y-9  prefers-reduced-motion honoured.
   [MUST] A11Y-10 Zoom allowed (NEVER maximum-scale / user-scalable=no).
                  Sizes in rem. No sideways scroll. Safe-area insets.
   [MUST] A11Y-11 Icons are aria-hidden and always paired with a text label.
                  Emoji fallback (data-fb) if the icon CDN is blocked.
   [MUST] A11Y-12 Touch targets at least 44px high. Exception: the compact
                  accessibility toolbar (32px, above WCAG 2.2 AA's 24px minimum).
 VOICE
   [MUST] VOICE-1 Read aloud: Read / Pause / Stop / Speed. Clear message if
                  the browser lacks speechSynthesis.
   [MUST] VOICE-2 Dictation mic on EVERY text field (auto-added, opt out with
                  data-nomic). Stops on tab change. Errors announced.
                  Privacy note shown (browser may send audio to a server).
                  Unsupported browsers get a message, never a broken button.
 DATA
   [MUST] DATA-1  localStorage only through store()/load() (try/catch,
                  prefixed with CFG.pfx). App must work if storage is blocked.
   [MUST] DATA-2  Saved data is versioned ({v,data}); unknown keys ignored.
   [MUST] DATA-3  Destructive actions (Clear, Import-replace) use confirm().
   [SHOULD] DATA-4 JSON backup/restore so work moves between devices.
 EXPORT
   [MUST] EXP-1   One Export dialog offering ALL of: PowerPoint (.pptx),
                  Word (.docx), PDF, CSV, Markdown. Plus Copy text + Print.
   [MUST] EXP-2   Every exporter reads model() - one source of truth.
   [MUST] EXP-3   Export disabled (and explained) until there is content.
   [MUST] EXP-4   Filename = CFG.file + date. CSV: UTF-8 BOM + formula-
                  injection guard. DOCX built with the zero-dependency zip
                  writer (works offline). Library-based formats check the
                  library loaded and say so if not.
   [MUST] EXP-5   Saving goes through save(): uses the host "downloads"
                  capability when present, else a Blob + <a download>.
 SECURITY / HOSTING
   [MUST] SEC-1   All dynamic HTML passes through esc(). No eval, no inline
                  event attributes built from user text.
   [MUST] SEC-2   CDN scripts only from cdnjs.cloudflare.com (preferred) or
                  cdn.jsdelivr.net/npm/ (NOT /gh/ - blocked on hosted pages).
                  Pin exact versions. Page is one file under 16 MB.
 RESPONSIVE / PRINT
   [MUST] RESP-1  Works at 320px wide. Wrapping on long words.
   [SHOULD] PRINT-1 Print stylesheet hides chrome (prints the active tab).

 KNOWN ANTI-PATTERNS FOUND IN THE SOURCE FILES (do not copy)
   - user-scalable=no / maximum-scale=1 in Spot the Bug (breaks zoom).
   - White text on the Night pink (#FF2E88) is only 3.5:1; fixed below by
     using dark text there.
   - jsDelivr /gh/ URLs for PptxGenJS; use /npm/ or cdnjs instead.
   - Tailwind play CDN: not needed. Tokens below replace it.
   - OpenDyslexic may not resolve from Google Fonts, so the dyslexic mode
     relies on its fallback stack (Comic Sans / Verdana + wider spacing).
     Embed a base64 woff2 if the real typeface is a hard requirement.
   - jsPDF built-in fonts are Latin-only. Use DOCX/PPTX for other scripts.
================================================================================
-->
<head>
<meta charset="utf-8">
<!-- A11Y-10: no maximum-scale, no user-scalable=no. viewport-fit enables safe-area insets. -->

<title>Card Sorting: Esports Event App</title>
<style>
/* ===== THEME TOKENS (A11Y-2, A11Y-3) =====
   Contrast vs --card (AA needs 4.5:1 text, 3:1 large/UI):
   NIGHT  tx 13.3  mu 6.9  cy 11.1  li 14.1  am 11.1  pk 4.9 (dark text on pk)
   DAY    tx 17.9  mu 7.6  cy 5.4   li 5.0   am 5.0   pk 6.0 (white text on pk)
   CONTRAST tx 21   mu/cy/am 19.6  li 15.5  pk 8.0 (black text on pk)
   Text on a --cy button uses --bg: 12.4 / 5.1 / 19.6.
   Re-check any colour you add. Tokens only: never hard-code colours in rules. */
:root{--bg:#0B0F1A;--card:#151B2E;--bd:#2c3552;--cy:#00E5FF;--pk:#FF2E88;--onpk:#0B0F1A;--li:#B6FF3B;--am:#FFC83D;--mu:#9AA4BF;--tx:#DDE3F2;--hd:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-size:100%}
:root[data-theme=day]{--bg:#f8fafc;--card:#fff;--bd:#94a3b8;--cy:#0e7490;--pk:#be185d;--onpk:#fff;--li:#4d7c0f;--am:#b45309;--mu:#475569;--tx:#0f172a;--hd:#0f172a;color-scheme:light}
:root[data-theme=contrast]{--bg:#000;--card:#000;--bd:#ff0;--cy:#ff0;--pk:#f6c;--onpk:#000;--li:#0f6;--am:#ff0;--mu:#ff0;--tx:#fff;--hd:#fff;color-scheme:dark}
:root[data-theme=contrast] .panel,:root[data-theme=contrast] textarea,:root[data-theme=contrast] input[type=text],:root[data-theme=contrast] select,:root[data-theme=contrast] .dlg,:root[data-theme=contrast] .rc{border-width:2px}

/* ===== BASE (A11Y-10, RESP-1) ===== */
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4rem)}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.45 Calibri,Arial,sans-serif;transition:background-color .2s,color .2s}
p,span,h1,h2,h3,div,label,button,small,li{overflow-wrap:anywhere}
/* Dyslexic mode swaps EVERY font (buttons and headings too) and loosens spacing */
body.dys,body.dys *{font-family:"OpenDyslexic","Open Dyslexic","Comic Sans MS","Comic Neue",Verdana,sans-serif!important}
body.dys{letter-spacing:.03em;word-spacing:.08em;line-height:1.7}
/* A11Y-4 */
:focus-visible{outline:3px solid var(--am)!important;outline-offset:2px}
/* A11Y-1 skip link: hidden until focused */
.skip{position:absolute;left:-999px;top:0;background:var(--cy);color:var(--bg);padding:10px 16px;z-index:100;font-weight:700}
.skip:focus{left:8px;top:8px}

/* ===== ACCESSIBILITY TOOLBAR ===== */
.a11y{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:2px solid var(--bd);padding:8px 14px}
.a11y-in{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.a11y-l{font-size:.75rem;letter-spacing:2px;font-weight:700;color:var(--mu);text-transform:uppercase}
.grp{display:flex;align-items:center;gap:4px;background:var(--bg);border:1.5px solid var(--bd);border-radius:8px;padding:3px}
.a11y button{background:transparent;color:var(--tx);border:1.5px solid transparent;padding:2px 10px;min-height:2rem;font-size:.8125rem} /* compact bar: 32px, above the WCAG 2.2 AA 24px minimum */
.a11y button.on{background:var(--cy);color:var(--bg);border-color:var(--cy)}
.a11y .solo{background:var(--bg);border:1.5px solid var(--bd)}
#fsd{min-width:3.2em;text-align:center;font-size:.75rem;font-weight:700;color:var(--mu)}

/* ===== LAYOUT + CONTROLS ===== */
header,main{max-width:1000px;margin:0 auto;padding:0 20px}header{padding-top:22px}main{padding-bottom:40px}main:focus{outline:none}
.tag{display:inline-block;background:var(--li);color:var(--bg);font-weight:700;letter-spacing:2px;font-size:.75rem;padding:4px 12px}
h1{font:700 1.875rem "Trebuchet MS",Arial,sans-serif;color:var(--hd);margin:10px 0 2px}.sub{color:var(--mu);font-style:italic;margin:0 0 10px}
button{font:700 .9375rem "Trebuchet MS",Arial,sans-serif;border:0;border-radius:6px;padding:9px 16px;min-height:2.75rem;cursor:pointer;background:var(--cy);color:var(--bg)} /* A11Y-12 */
button.alt{background:transparent;color:var(--cy);border:1.5px solid var(--cy)}button:hover:not(:disabled){filter:brightness(1.12)}
button:disabled{opacity:.5;cursor:not-allowed}
select{background:var(--card);color:var(--hd);border:1.5px solid var(--bd);border-radius:6px;padding:7px 9px;min-height:2.75rem;font:inherit;max-width:100%}
.tts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 6px;padding:8px 10px;background:var(--card);border:1.5px solid var(--bd);border-radius:8px}
.tts button{background:transparent;color:var(--cy);border:1.5px solid var(--cy)}.tts label{color:var(--mu);font-size:.875rem;font-weight:700}
[role=tablist]{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
[role=tab]{background:var(--card);color:var(--mu);border:1.5px solid var(--bd);display:flex;gap:8px;align-items:center;font-size:.8125rem}
[role=tab][aria-selected=true]{background:var(--cy);color:var(--bg);border-color:var(--cy)}
.panel{background:var(--card);border:1.5px solid var(--bd);border-left:6px solid var(--li);border-radius:10px;padding:16px 18px}.panel:focus{outline:none}
.panel h2{font:700 1.375rem "Trebuchet MS",Arial,sans-serif;color:var(--hd);margin:0 0 4px}
label.f{display:block;font-weight:700;margin:12px 0 2px;color:var(--hd)}.hint{display:block;color:var(--mu);font-size:.875rem;margin-bottom:3px;font-weight:400}
textarea,input[type=text]{width:100%;background:var(--bg);color:var(--hd);border:1.5px solid var(--bd);border-radius:6px;padding:9px 11px;min-height:2.75rem;font:inherit}
textarea{min-height:4.5em;resize:vertical}
.ig{display:flex;align-items:stretch} /* input group: field + Dictate button, attached like a Tailwind button group */
.ig>textarea,.ig>input{flex:1 1 auto;width:auto;min-width:0;border-top-right-radius:0;border-bottom-right-radius:0}
.ig>.mic{margin:0;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 12px;font-size:.8125rem;border-left-width:0;border-radius:0 6px 6px 0}
.ref{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.ref.reflection-rows{grid-template-columns:minmax(0,1fr)}
.rc{--c:var(--cy);background:var(--bg);border:1.5px solid var(--c);border-radius:8px;padding:2px 14px 14px}.rc.sw{--c:var(--pk)}.rc.nw{--c:var(--li)}
.rc label.f{color:var(--c);font:700 1.125rem "Trebuchet MS",Arial,sans-serif;margin-top:12px}.rc .hint{font:400 .875rem Calibri,Arial,sans-serif;color:var(--mu)}
.cite{margin:12px 0 0;font-size:.8125rem}
.sel{margin:2px 0 8px}.sel label{display:block;font-size:.875rem;font-weight:700;color:var(--mu);margin-bottom:2px}.sel select{width:100%}
.rc select{border-color:var(--c)}
.mic[aria-pressed=true]{background:var(--pk);color:var(--onpk);border-color:var(--pk)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
/* Back / Next at the bottom of every tab */
.pnav{justify-content:space-between;margin-top:18px}.pnav button{flex:1 1 10rem}
@media print{.pnav{display:none!important}}
#live{min-height:1.5em;color:var(--li);font-weight:700;margin-top:10px}
/* A11Y-11: emoji shows only until Font Awesome replaces the <i> with an SVG */
i[data-fb]::before{content:attr(data-fb);font-style:normal;font-family:inherit}.svg-inline--fa,i[data-fb]{margin-right:.3em}.svg-inline--fa{width:1em;height:1em;display:inline-block;vertical-align:-.125em;flex-shrink:0}

/* ===== MODAL (A11Y-8) ===== */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}.ov[hidden]{display:none}
.dlg{background:var(--card);color:var(--tx);border:2px solid var(--bd);border-top:6px solid var(--li);border-radius:12px;width:100%;max-width:480px;max-height:100%;overflow:auto;padding:18px}
.dlg h2{font:700 1.375rem "Trebuchet MS",Arial,sans-serif;color:var(--hd);margin:0 0 4px}.dlg h3{font:700 1rem "Trebuchet MS",Arial,sans-serif;color:var(--cy);margin:14px 0 6px}.dlg .hint{margin:0 0 12px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:0 0 8px;padding:10px 14px}.opt small{display:block;font-weight:400;color:var(--mu);font-size:.8125rem}.dlg .close{margin-top:6px;width:100%}

/* ===== MOTION + PRINT (A11Y-9, PRINT-1) ===== */
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{.a11y,.skip,.tts,#tabs,.row,.mic,#dh,#live,button{display:none!important}body{background:#fff;color:#000}.panel{border-color:#000}textarea,input{border-color:#000;color:#000;background:#fff}}
.wg{margin:10px 0}.wh{font:700 1.125rem "Trebuchet MS",Arial,sans-serif;color:var(--cy);margin:16px 0 6px}
.pool,.chips{display:flex;flex-wrap:wrap;gap:8px}.pool{min-height:3rem;padding:8px;border:2px dashed var(--bd);border-radius:8px}
.cd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);border:1.5px solid var(--bd);border-radius:8px;padding:6px 8px;cursor:grab}.cd .em{font-size:1.5rem}.cd .ct{font-weight:700;color:var(--hd)}.cd select{max-width:11rem}
.gs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}.gp{border:2px solid var(--c);border-top-width:8px;border-radius:8px;padding:6px 10px 10px;min-height:5rem;display:flex;flex-direction:column;gap:6px}.gp h3{color:var(--c);margin:4px 0;font:700 1.0625rem "Trebuchet MS",Arial,sans-serif}
.bar{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 3.2rem;gap:8px;align-items:center;margin:4px 0}.tr{background:var(--bg);border:1.5px solid var(--bd);height:14px;border-radius:7px;overflow:hidden}.tr i{display:block;height:100%;background:var(--li)}
.rd{border-left:4px solid var(--am);padding:2px 12px;margin:10px 0}.rd a{color:var(--cy);font-weight:700}.wg>svg{width:100%;height:auto;max-width:640px;display:block;margin:8px 0}

.design-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin:16px 0}.design-grid>*{min-width:0}.design-grid>.tree-preview{position:sticky;top:5rem;align-self:start;max-height:calc(100vh - 6rem);overflow:auto}.tree-preview{border:2px solid var(--cy);border-radius:10px;padding:14px;background:var(--bg)}.tree-root{border:2px solid var(--li);padding:12px;border-radius:8px;color:var(--hd)}.tree-list{list-style:none;margin:10px 0;padding-left:16px;border-left:2px solid var(--bd)}.tree-list li{margin:8px 0}.tree-node{border:1px solid var(--bd);padding:8px;border-radius:6px}.tree-node b{color:var(--cy)}.tree-leaf{color:var(--tx);padding:4px 0}.tree-badge{display:block;font-size:.875rem;color:var(--mu)}.node-editor{border:1px solid var(--bd);border-radius:8px;padding:10px;margin:10px 0;background:var(--bg)}.node-editor textarea{min-height:4rem}.node-editor select{width:100%}.priority-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);align-items:center}.title-feature{border:2px solid var(--li);padding:12px;border-radius:8px;margin:10px 0}.title-support{border:1px solid var(--bd);padding:10px;border-radius:6px;margin:6px 0}.tree-actions{display:flex;gap:8px;flex-wrap:wrap}.preview-nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.preview-nav span{border:1px solid var(--cy);padding:6px;border-radius:5px}.alert-note{border-left:4px solid var(--am);padding:8px 12px;background:var(--bg)}.builder-line{border-bottom:1px solid var(--bd);padding:10px 0}.builder-line select{width:100%}
@media(max-width:700px){.design-grid{grid-template-columns:1fr}.design-grid>.tree-preview{position:static;max-height:none;overflow:visible}.priority-row{grid-template-columns:1fr}.tree-list{padding-left:10px}}@media print{.tree-preview{break-inside:avoid}.design-grid{display:block}.tree-preview,.tree-node{color:#000;border-color:#000}.tree-root{color:#000;border-color:#000}}

.tutorial-card{border:2px solid var(--cy);border-radius:10px;padding:18px;margin:12px 0;background:var(--bg)}.tutorial-card h3{font-size:1.4rem;color:var(--cy);margin:8px 0}.tutorial-card h4{font-size:1.05rem;margin:16px 0 8px}.tutorial-count{color:var(--li);font-weight:700;font-size:.875rem}.tutorial-card li,.stage-help li{margin:8px 0}.tutorial-example{border-left:4px solid var(--am);padding:12px;margin:16px 0;background:var(--card)}.tutorial-example p{margin:6px 0}.tutorial-done{border-top:1px solid var(--bd);padding-top:12px}.tutorial-tree ul{border-left:2px solid var(--bd);padding-left:24px;list-style:none}.tutorial-tree li{margin:6px 0}.tutorial-glossary{margin:14px 0}.tutorial-glossary summary{cursor:pointer;color:var(--cy);font-weight:700}.tutorial-glossary dt{font-weight:700;margin-top:10px}.tutorial-glossary dd{margin-left:0}.stage-help{border-left:4px solid var(--cy);padding:12px 16px;background:var(--bg);margin:12px 0}.stage-help h3{margin:0 0 6px;color:var(--cy)}.stage-help ol{padding-left:22px}.stage-help p{font-size:.9375rem}.stage-help button{margin-top:4px}@media print{.stage-help{display:none}}
</style>

<body>
<a class="skip" href="#main">Skip to main content</a>

<!-- A11Y-2: toolbar. Buttons are wired in boot(). aria-pressed reflects state. -->
<div class="a11y" id="a11y" role="toolbar" aria-label="Accessibility options"><div class="a11y-in">
  <span class="a11y-l">Accessibility</span>
  <div class="grp" role="group" aria-label="Colour theme">
    <button type="button" id="th-day" aria-pressed="false"><i class="fa-solid fa-sun" data-fb="☀" aria-hidden="true"></i> Day</button>
    <button type="button" id="th-night" aria-pressed="false"><i class="fa-solid fa-moon" data-fb="☾" aria-hidden="true"></i> Night</button>
    <button type="button" id="th-contrast" aria-pressed="false"><i class="fa-solid fa-circle-half-stroke" data-fb="◐" aria-hidden="true"></i> Contrast</button>
  </div>
  <div class="grp" role="group" aria-label="Text size">
    <button type="button" id="fm" aria-label="Decrease text size">A-</button><span id="fsd" aria-live="polite">100%</span><button type="button" id="fp" aria-label="Increase text size">A+</button>
  </div>
  <button type="button" class="solo" id="dys" aria-pressed="false"><i class="fa-solid fa-font" data-fb="Aa" aria-hidden="true"></i> Dyslexic font</button>
</div></div>

<header><span class="tag" id="kick"></span><h1 id="ttl"></h1><p class="sub" id="sub"></p></header>

<main id="main" tabindex="-1">
  <!-- VOICE-1: read aloud -->
  <div class="tts" role="group" aria-label="Read aloud">
    <button type="button" id="rd"><i class="fa-solid fa-volume-high" data-fb="🔊" aria-hidden="true"></i> Read this card</button>
    <button type="button" id="ps"><i class="fa-solid fa-pause" data-fb="⏸" aria-hidden="true"></i> <span id="pst">Pause</span></button>

/* =============================================================================

    sections: TABS.map(t => ({h: t.title, rows: t.fields.map(f => [f.label, g(f.k) || "(empty)"])}))};
}
const stamp = () => new Date().toISOString().slice(0, 10);
const fileName = ext => `${CFG.file}-${stamp()}.${ext}`;           // EXP-4

function md(){ const m = model(); return "# " + m.title + "\n\n" + m.sections.map(s => "## " + s.h + "\n\n" + s.rows.map(r => "**" + r[0] + "**\n\n" + r[1]).join("\n\n")).join("\n\n") + "\n" }
/* EXP-4: guard against spreadsheet formula injection (=,+,-,@) + UTF-8 BOM for Excel */
const cell = v => { v = String(v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"' };

const xe = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");

/* --- PDF via jsPDF (CDN). Latin text only. Page break handled by room(). --- */
function pdf(){
  const m = model(), d = new window.jspdf.jsPDF({unit: "mm", format: "a4"}), L = 15, W = 180; let y = 20;
  const room = h => { if (y + h > 282){ d.addPage(); y = 20 } };
  d.setFont("helvetica", "bold"); d.setFontSize(20); d.setTextColor(14, 116, 144);
  d.splitTextToSize(m.title, W).forEach(l => { room(9); d.text(l, L, y); y += 9 }); y += 4;
  m.sections.forEach(s => {
    room(14); d.setFont("helvetica", "bold"); d.setFontSize(14); d.setTextColor(14, 116, 144); d.text(s.h, L, y); y += 8;
    s.rows.forEach(r => {

    }); y += 4;
  });

}

model=function(){const m={title:g("name")||CFG.title,sections:TABS.map(t=>({h:t.title,rows:t.fields.filter(f=>!f.hidden).map(f=>[f.label,g(f.k)||"(empty)"])})).filter(s=>s.rows.length)},cs=getCards(),ex=[];
 if(cs.length)ex.push({h:"Card deck",rows:[["Cards ("+cs.length+")",cs.map(c=>c.t).join("; ")]]});
 getSorts().forEach(s=>ex.push({h:s.p+" ("+s.mode+" sort)",rows:Object.keys(s.g).map(k=>[k,s.g[k].join("; ")])}));
 const st=getStructure();if(st.nodes.length){ex.push({h:"Overall event hierarchy",rows:[["Hierarchy",treeText(st)]]});ex.push({h:"Category labels and evidence",rows:st.nodes.map(n=>[pathLabel(n.id,st),n.reason||"Evidence or hypothesis not recorded"])});}const home=getHome();if(Object.keys(home).length)ex.push({h:"Title page content priorities",rows:getCards().filter(c=>home[c.t]&&home[c.t]!=="nav").map(c=>[homeLabel(home[c.t]),c.t])});m.sections.splice(Math.max(m.sections.length-1,0),0,...ex);return m};

function getStructure(){const raw=pj('cs_structure',{}),nodes=(Array.isArray(raw.nodes)?raw.nodes:[]).filter(n=>n&&typeof n.id==='string'&&typeof n.label==='string').slice(0,40).map(n=>({id:n.id.slice(0,80),label:n.label.slice(0,60),parent:typeof n.parent==='string'?n.parent:'',reason:typeof n.reason==='string'?n.reason.slice(0,1200):''}));const ids=new Set();const unique=nodes.filter(n=>{if(ids.has(n.id))return false;ids.add(n.id);return true});for(const n of unique){if(!ids.has(n.parent)||n.parent===n.id)n.parent='';let p=n.parent,seen=new Set([n.id]);while(p){if(seen.has(p)){n.parent='';break}seen.add(p);p=unique.find(x=>x.id===p)?.parent||''}}const map=Object.create(null);const cards=new Set(getCards().map(c=>c.t));if(raw.map&&typeof raw.map==='object')for(const [t,id]of Object.entries(raw.map)){if(cards.has(t)&&ids.has(id))map[t]=id}return {nodes:unique,map,source:typeof raw.source==='string'?raw.source:''}}
function getHome(){const raw=pj('cs_home',{}),h=Object.create(null);for(const c of getCards()){const v=Object.hasOwn(raw,c.t)?raw[c.t]:'';if(['1','2','3','support','nav'].includes(v))h[c.t]=v}return h}
const homeLabel=v=>({'1':'Featured 1','2':'Featured 2','3':'Featured 3',support:'Supporting content',nav:'Navigation only'}[v]||'Not yet decided');
function pathLabel(id,st){const names=[];let n=st.nodes.find(n=>n.id===id),count=0;while(n&&count++<40){names.unshift(n.label||'[Unnamed section]');n=st.nodes.find(x=>x.id===n.parent)}return names.join(' / ')}
function descendant(id,parent,st){let p=parent,seen=new Set();while(p&&!seen.has(p)){if(p===id)return true;seen.add(p);p=st.nodes.find(x=>x.id===p)?.parent||''}return false}
function treeText(st=getStructure()){const lines=[(g('name')||'Your esports event')+' — Title page'];function walk(parent,depth){for(const n of st.nodes.filter(n=>n.parent===parent)){lines.push('  '.repeat(depth)+n.label);walk(n.id,depth+1);for(const c of getCards().filter(c=>st.map[c.t]===n.id))lines.push('  '.repeat(depth+1)+c.t)}}walk('',1);const un=getCards().filter(c=>!st.map[c.t]);if(un.length)lines.push('Unplaced: '+un.map(c=>c.t).join(', '));return lines.join('\n')}
function treeHTML(st=getStructure()){function branch(parent){const children=st.nodes.filter(n=>n.parent===parent);return children.length?'<ul class="tree-list">'+children.map(n=>'<li><div class="tree-node"><b>'+esc(n.label||'Unnamed section')+'</b><span class="tree-badge">'+(n.parent?'Subsection':'Main section')+'</span></div>'+branch(n.id)+(getCards().some(c=>st.map[c.t]===n.id)?'<ul class="tree-list">'+getCards().filter(c=>st.map[c.t]===n.id).map(c=>'<li class="tree-leaf">'+esc(c.e)+' '+esc(c.t)+'<span class="tree-badge">Content page</span></li>').join('')+'</ul>':'')+'</li>').join('')+'</ul>':''}const un=getCards().filter(c=>!st.map[c.t]);return '<div class="tree-root"><b>'+esc(g('name')||'Your esports event')+'</b><span class="tree-badge">Root · Title / home page</span></div>'+branch('')+(!st.nodes.length?'<p class="hint">Create a main section or use a saved sort to start your hierarchy.</p>':'')+(un.length?'<p class="alert-note">'+un.length+' content page'+(un.length===1?' is':'s are')+' still unplaced: '+un.map(c=>esc(c.t)).join(', ')+'</p>':'')}
function updateTree(){const st=getStructure();if($("wg"))$("wg").querySelectorAll("select option").forEach(o=>{if(st.nodes.some(n=>n.id===o.value))o.textContent=pathLabel(o.value,st)});if($('hierarchy-live'))$('hierarchy-live').innerHTML=treeHTML();if($('home-live'))$('home-live').innerHTML=homeHTML()}
function structureAct(a,v,x,id){const st=getStructure(),cards=getCards();
 if(a==='tree-seed'){const sorts=getSorts(),i=+$('seed-sort').value,s=sorts[i];if(!s)return say('Save a participant sort on the Sort tab first.');if(st.nodes.length&&!confirm('Replace the proposed hierarchy with this saved sort? Your participant sorts and title-page priorities will remain.'))return;const map=Object.create(null),nodes=Object.keys(s.g).map((label,i)=>{const node={id:'section-'+i,label,parent:'',reason:'Starting label from '+s.p+' ('+s.mode+' sort). Check against other participants.'};s.g[label].forEach(t=>{if(cards.some(c=>c.t===t))map[t]=node.id});return node});sj('cs_structure',{nodes,map,source:s.p});wgDraw();return say('Hierarchy created from '+s.p+'. This is a proposed design, not an agreed structure.')}
 if(a==='tree-add'){const label=($('new-section').value||'').trim().slice(0,60),parent=$('section-parent').value;if(!label)return say('Name the section first.');if(st.nodes.length>=40)return say('This builder supports 40 sections.');if(st.nodes.some(n=>n.parent===parent&&n.label.toLowerCase()===label.toLowerCase()))return say('That label already exists at this level.');st.nodes.push({id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),label,parent,reason:''});sj('cs_structure',st);wgDraw('new-section');return say('Added '+(parent?'subsection':'main section')+': '+label)}
 if(a==='tree-parent'){const n=st.nodes.find(n=>n.id===x);if(!n||descendant(n.id,v,st))return say('A section cannot sit inside itself or its descendants.');if(v&&!st.nodes.some(n=>n.id===v))return; n.parent=v;sj('cs_structure',st);wgDraw(id);return say('Section moved. Hierarchy updated.')}
 if(a==='tree-page'){if(!cards.some(c=>c.t===x)||(v&&!st.nodes.some(n=>n.id===v)))return;if(v)st.map[x]=v;else delete st.map[x];sj('cs_structure',st);updateTree();return say(x+(v?' placed under '+pathLabel(v,st):' left unplaced'))}
 if(a==='tree-remove'){const n=st.nodes.find(n=>n.id===v);if(!n||!confirm('Remove '+n.label+'? Its subsections move up one level and its content pages become unplaced.'))return;st.nodes=st.nodes.filter(n=>n.id!==v);st.nodes.forEach(k=>{if(k.parent===v)k.parent=n.parent});Object.keys(st.map).forEach(k=>{if(st.map[k]===v)delete st.map[k]});sj('cs_structure',st);wgDraw();return say('Section removed. Check the updated hierarchy.')}
 if(a==='home-priority'){const home=getHome();if(!cards.some(c=>c.t===x))return;if(['1','2','3'].includes(v))for(const t of Object.keys(home))if(t!==x&&home[t]===v)home[t]='nav';if(v)home[x]=v;else delete home[x];sj('cs_home',home);wgDraw(id);return say(x+': '+homeLabel(v)+'. Each featured position holds one item.')}
}
function wStructure(){const st=getStructure(),sorts=getSorts(),cards=getCards();return `<div class="alert-note"><b>Build Game Structure</b><p>Move from an event title page to main categories, optional subsections, and individual content pages. Use audience evidence to explain the organisation.</p></div><div class="design-grid"><section><h3 class="wh">Build your hierarchy</h3><label class="f" for="seed-sort">Start from participant evidence</label><select id="seed-sort">${sorts.map((s,i)=>`<option value="${i}">${esc(s.p)} (${esc(s.mode)} sort)</option>`).join('')||'<option value="">No saved sorts yet</option>'}</select><div class="row"><button data-a="tree-seed" ${sorts.length?'':'disabled'}>Use this sort as a starting point</button></div><p class="hint">A saved sort stays unchanged. Compare it with others before finalising your design.</p><label class="f" for="new-section">New section label</label><input type="text" id="new-section" maxlength="60" aria-describedby="section-help"><span class="hint" id="section-help">Example only: Attend, Watch or Tournament. Use labels your participants understand.</span><label class="f" for="section-parent">Put the new section under</label><select id="section-parent"><option value="">Title page (main section)</option>${st.nodes.map(n=>`<option value="${esc(n.id)}">${esc(pathLabel(n.id,st))}</option>`).join('')}</select><div class="row"><button data-a="tree-add">Add section</button></div><h3 class="wh">Sections and their parents</h3>${st.nodes.map((n,i)=>`<div class="node-editor"><label class="f" for="label${i}">Section label ${i+1}</label><input id="label${i}" type="text" data-node="${esc(n.id)}" data-prop="label" maxlength="60" value="${esc(n.label)}"><label class="f" for="parent${i}">Parent of ${esc(n.label)}</label><select id="parent${i}" data-a="tree-parent" data-v="${esc(n.id)}"><option value="">Title page (main section)</option>${st.nodes.filter(p=>!descendant(n.id,p.id,st)).map(p=>`<option value="${esc(p.id)}"${p.id===n.parent function homeHTML(){const home=getHome(),cards=getCards(),st=getStructure();const featured=['1','2','3'].map(v=>{const c=cards.find(c=>home[c.t]===v);return c?`<div class="title-feature"><span class="tree-badge">Featured ${v}</span><b>${esc(c.e)} ${esc(c.t)}</b></div>`:''}).join('');const undecided=cards.filter(c=>!home[c.t]).length;return `<div class="tree-root"><b>${esc(g('name')||'Your esports event')}</b><p>${esc(g('event_date')||'Add event date')} · ${esc(g('event_venue')||'Add venue / online location')}</p><span class="tree-badge">Title page essentials · event identity</span></div><h4>Navigation</h4><div class="preview-nav">${st.nodes.filter(n=>!n.parent).map(n=>'<span>'+esc(n.label)+'</span>').join('')||'<span>Build main sections on the Structure tab</span>'}</div><h4>Featured content</h4>${featured||'<p class="hint">Choose up to three featured items to create the title-page layout.</p>'}<h4>Supporting information</h4>${cards.filter(c=>home[c.t]==='support').map(c=>'<div class="title-support">'+esc(c.e)+' '+esc(c.t)+'</div>').join('')||'<p class="hint">No supporting items selected.</p>'}<p class="hint">Navigation-only content remains in the hierarchy and does not need a separate title-page tile.</p>${undecided?'<p class="alert-note">'+undecided+' content priorities still undecided.</p>':''}`}

function tutorialAction(a,v,x){if(a==='tutorial-next'||a==='tutorial-back'){tutorialStep=Math.max(0,Math.min(TUTORIAL.length-1,tutorialStep+(a==='tutorial-next'?1:-1)));wgDraw();$('wg').querySelector('h3').setAttribute('tabindex','-1');$('wg').querySelector('h3').focus();say('Tutorial step '+(tutorialStep+1));return}if(a==='tutorial-open'){openTab(TABS.findIndex(t=>t.title===TUTORIAL[tutorialStep].tab));$('panel').focus();return}if(a==='tutorial-demo'){if(v)tutorialDemo[x]=v;else delete tutorialDemo[x];wgDraw('demo'+x);return}if(a==='tutorial-help'){const index=TUTORIAL.findIndex(t=>t.tab===TABS[cur].title);tutorialStep=index<0?0:index;openTab(0);$('panel').focus()}}
function stageHelp(t){const i=TUTORIAL.findIndex(s=>s.tab===t.title);if(i<0)return '';const s=TUTORIAL[i];return `<section class="stage-help"><h3>Your task on this tab</h3><ol>${s.todo.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol><p><b>Finished when:</b> ${esc(s.done)}</p><button type="button" class="alt" id="stage-tutorial">Show this tutorial step</button></section>`}

boot();
