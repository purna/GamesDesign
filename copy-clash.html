<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copy / Clash — The rights & wrongs game for games design students</title><style>
:root{--bg:#101326;--panel:#1b2038;--muted:#bec4da;--ink:#f7f5ed;--lime:#d5fa69;--pink:#ff93c7;--line:#3c4261}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.5}body:before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 85% 5%,#47244e66,transparent 50%),radial-gradient(ellipse at 10% 70%,#24474155,transparent 50%)}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:13px 19px;background:var(--panel);color:var(--ink);text-align:left}button:hover{border-color:var(--lime);transform:translateY(-2px)}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--pink);outline-offset:5px}button.primary{background:var(--lime);color:#172019;font-weight:800;border:0}button.pink{background:var(--pink);color:#25172a;font-weight:800}button:disabled{cursor:default;opacity:.6;transform:none}.wrap{max-width:1120px;margin:auto;padding:24px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-weight:900;letter-spacing:-1px;font-size:24px}.brand span{color:var(--lime)}nav{display:flex;gap:8px}nav button{font-size:14px;padding:9px 13px}main{padding:42px 0}main:focus{outline:none}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--lime);text-transform:uppercase}h1{font-size:clamp(48px,8vw,94px);line-height:.98;letter-spacing:-5px;margin:22px 0}h1 em{font-style:normal;color:var(--lime)}h2{font-size:clamp(28px,4vw,44px);line-height:1.1;letter-spacing:-1.5px;margin:16px 0}h3{margin:0 0 9px}p{margin:12px 0}.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center}.intro{max-width:620px;font-size:20px}.sticker{border:2px solid var(--lime);border-radius:30px;aspect-ratio:1;max-width:290px;margin:20px auto;display:grid;place-content:center;text-align:center;transform:rotate(8deg);box-shadow:12px 12px 0 #0004;background:#222b32}.sticker strong{font-size:100px;line-height:1;color:var(--lime)}.sticker span{font-weight:800;letter-spacing:4px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:35px}.role{padding:27px;border-radius:20px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:10px}.role p{flex:1;color:var(--muted)}.role .avatar{font-size:35px}.role h3{font-size:26px}.small{font-size:13px;color:var(--muted)}footer{border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--muted)}.hud{display:flex;gap:22px;align-items:center;justify-content:space-between;margin-bottom:20px}.stats{display:flex;gap:20px}.stat strong{color:var(--lime);font-size:24px}.route{display:flex;gap:7px;margin-bottom:26px}.dot{height:7px;flex:1;border-radius:4px;background:var(--line)}.dot.done{background:var(--lime)}.board{display:grid;grid-template-columns:1fr 280px;gap:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px}.evidence{border-left:3px solid var(--pink);padding:0 0 0 18px;margin:24px 0;color:var(--muted)}.choices{display:grid;gap:12px;margin-top:25px}.choice{width:100%;display:flex;align-items:center;gap:16px;padding:17px}.key{border:1px solid var(--line);border-radius:7px;min-width:28px;text-align:center;font-size:13px;color:var(--lime)}aside{padding:22px;border:1px solid var(--line);border-radius:20px;align-self:start}aside p{font-size:15px;color:var(--muted)}.feedback{border-top:1px solid var(--line);margin-top:25px;padding-top:22px}.boundary{margin:18px 0;padding:15px;background:#10132699;border-radius:12px}.boundary b{display:block;color:var(--lime);font-size:12px;letter-spacing:1.5px}.boundary.ethics b{color:var(--pink)}.deltas{color:var(--pink);font-weight:bold}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}dialog{color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:20px;max-width:760px;width:calc(100% - 32px);max-height:85vh;padding:28px}dialog::backdrop{background:#080a17dd}dialog h2{font-size:30px}dialog a{color:var(--lime)}dialog .close{float:right}details{border-bottom:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:700}.tag{display:inline-block;background:#303d2b;color:var(--lime);border-radius:30px;padding:7px 12px;font-size:13px}.log{border-bottom:1px solid var(--line);padding:15px 0}.score{font-size:62px;color:var(--lime);font-weight:900}.imgIcon{font-size:72px;text-align:center;margin:18px 0;padding:26px;border:1px dashed var(--line);border-radius:16px;background:#0f1226}.in{animation:appear .25s ease-out}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}button:hover{transform:none}}@media(max-width:720px){.wrap{padding:18px}main{padding:27px 0}.hero,.roles,.board{grid-template-columns:1fr}.sticker{display:none}h1{letter-spacing:-3px}.card{padding:22px}header{align-items:flex-start}.brand{font-size:20px}nav{flex-wrap:wrap;justify-content:flex-end}.hud{align-items:flex-start;gap:10px}.stats{gap:12px}.stat{font-size:13px}.stat strong{font-size:20px}aside{display:none}}@media print{header,footer,.actions,nav,dialog{display:none}body{background:white;color:black}.card{background:white;color:black}.muted,.small{color:#333}.log{break-inside:avoid}.score{color:black}}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px 0}.gallery figure{margin:0;border:1px solid var(--line);border-radius:14px;padding:14px}.gallery img{width:100%;height:190px;object-fit:contain;background:#101326;border-radius:8px}.gallery figcaption{font-size:14px;margin-top:12px}.gallery a{overflow-wrap:anywhere}.gallery .tag{margin:10px 0}#imageFeedback{margin-top:18px} @media(max-width:600px){.gallery{grid-template-columns:1fr}} </style></head><body><div class="wrap"><header><div class="brand">COPY <span>/</span> CLASH</div><nav><button onclick="openGallery()">Image challenge</button><button onclick="openGuide()">Field guide</button><button onclick="openTeacher()">For teachers</button></nav></header><main id="app" tabindex="-1"></main><footer>UK edition · Built for games design & development students · 10–20 minutes per role · Fictional scenarios, simplified for learning. Outcomes and scores are game mechanics, not legal predictions. No accounts, tracking or uploads.</footer></div><dialog id="modal"><button class="close" onclick="document.querySelector('#modal').close()" aria-label="Close panel">✕</button><div id="modalBody"></div></dialog>
<script>
const missions={"holder": [{"title": "Your art. Their merch.", "tag": "01 / THE MARKET", "story": "You are Nova, an independent game artist. A shop is selling shirts printed with your original dragon. You never licensed it.", "evidence": "You have dated project files. The shop copied the whole image for commercial merchandise.", "choices": [{"label": "Save evidence. Request removal or offer a licence.", "result": "You protect your work and leave room for a fair solution.", "law": "On these facts, commercial copying needs permission; no exception is apparent.", "ethics": "A factual, proportionate response respects people while protecting your livelihood.", "t": 15, "b": 5}, {"label": "Send your followers to attack the shop.", "result": "The argument goes viral. Your community turns hostile.", "law": "Owning copyright does not authorise harassment; other laws may apply.", "ethics": "Target the misuse, not the person. Public pile-ons can cause disproportionate harm.", "t": -20, "b": 25}, {"label": "Ignore it: no \u00a9 means no rights.", "result": "The shop keeps selling. Your assumption costs you control.", "law": "UK copyright protection is automatic for qualifying works; a notice is optional.", "ethics": "Choosing not to enforce is your choice, but make it with accurate information.", "t": -5, "b": -5}]}, {"title": "The remix request", "tag": "02 / THE STUDIO", "story": "A student wants to animate your dragon for a free school showcase. They ask before starting.", "evidence": "You own all rights in the drawing. You want to support learning but keep commercial rights.", "choices": [{"label": "Offer a clear, limited licence with credit.", "result": "The student gets creative. You keep your ownership.", "law": "Permission can specify uses and conditions without transferring copyright.", "ethics": "Clear expectations avoid surprises and recognise both creators.", "t": 15, "b": 10}, {"label": "Refuse politely.", "result": "You keep exclusive control. The student finds another asset.", "law": "You can normally decline a licence when no exception applies.", "ethics": "A respectful refusal is legitimate; generosity is a choice, not a duty.", "t": 5, "b": 0}, {"label": "Say yes, then demand payment after the show.", "result": "Your surprise demand damages trust.", "law": "Existing permission and its terms matter; you cannot simply pretend it never existed.", "ethics": "Changing expectations after someone relies on your promise is unfair.", "t": -15, "b": 10}]}, {"title": "The one-star review", "tag": "03 / THE FEED", "story": "A reviewer criticises your game and shows brief, credited clips to explain the problems. You dislike the review.", "evidence": "The game has been released. The clips are relevant, limited and do not replace playing it.", "choices": [{"label": "Assess fair dealing; respond to the criticism.", "result": "You defend your work without silencing discussion.", "law": "Fair dealing for criticism or review may permit this use with sufficient acknowledgement. It depends on the facts.", "ethics": "Criticism is not automatically abuse. Engage with the argument.", "t": 15, "b": 5}, {"label": "Demand removal because all clips are forbidden.", "result": "Your demand overstates your control.", "law": "Copyright has exceptions. Ownership does not give a blanket veto on criticism.", "ethics": "Using claims to suppress honest criticism can chill useful discussion.", "t": -15, "b": 5}, {"label": "Ask for more context before making a claim.", "result": "You investigate the amount used and its purpose.", "law": "Context matters: purpose, amount and market impact inform fairness.", "ethics": "Checking facts before accusing someone is responsible.", "t": 10, "b": 0}]}, {"title": "The paid commission", "tag": "04 / THE CONTRACT", "story": "You hire freelance artist Ari to draw a character for your game. You now want to sell the artwork to another studio.", "evidence": "Your written contract licenses use in your game only. It contains no copyright assignment.", "choices": [{"label": "Negotiate a new agreement with Ari.", "result": "You build a fair deal for a new use.", "law": "Paying a freelancer does not automatically transfer copyright. Your licence is limited to the agreed use.", "ethics": "Respecting the agreement values Ari\u2019s labour and bargaining power.", "t": 15, "b": 5}, {"label": "Sell it: you paid, so you own every right.", "result": "Ari challenges the sale. Your launch stalls.", "law": "A transfer of copyright needs a signed written assignment; your existing licence does not cover this sale.", "ethics": "Payment is not a reason to ignore agreed limits.", "t": -20, "b": 20}, {"label": "Keep to the original licence and cancel the sale.", "result": "The game continues, but the extra deal ends.", "law": "You can keep using the art within your licence.", "ethics": "Walking away from a deal is better than promising rights you do not hold.", "t": 10, "b": -5}]}, {"title": "The embarrassing photo", "tag": "05 / THE AFTERPARTY", "story": "You took a photo of your teammate asleep at the game jam. It could make a hilarious promotional post.", "evidence": "Assume you own copyright in the photo. Your teammate has not agreed to this use.", "choices": [{"label": "Ask first and accept a no.", "result": "Your teammate chooses a different photo.", "law": "Copyright ownership alone does not settle privacy, data protection or other rights.", "ethics": "Respect, consent and dignity matter even when you created the image.", "t": 15, "b": 5}, {"label": "Post it: my camera, my rules.", "result": "The post gets laughs. Your teammate feels humiliated.", "law": "Being the copyright holder is not a complete legal permission slip. Other rights may apply.", "ethics": "Attention does not justify exposing someone\u2019s vulnerable moment.", "t": -20, "b": 25}, {"label": "Use an illustration without identifying them.", "result": "The joke becomes a fictional scene.", "law": "Your own original illustration avoids copying this photo; other legal concerns still depend on content.", "ethics": "You can be entertaining without making a real person the target.", "t": 10, "b": 5}]}, {"title": "Free means forever?", "tag": "06 / THE LICENCE", "story": "You released a texture under CC BY 4.0. A commercial game uses it with proper credit, a licence link and a change notice. You wish you had charged.", "evidence": "The developer meets the licence terms. No separate rights are at issue.", "choices": [{"label": "Respect the licence; charge for future work.", "result": "Your reputation for clear promises grows.", "law": "CC BY permits commercial reuse. You cannot revoke the licence from someone complying with its terms.", "ethics": "Honour the permission you offered, even when the work becomes successful.", "t": 15, "b": 10}, {"label": "Demand a fee or threaten a takedown.", "result": "The developer points to your own licence.", "law": "The existing compliant use is authorised; regret does not cancel that permission.", "ethics": "Threats based on rights you already licensed undermine trust.", "t": -20, "b": 5}, {"label": "Invite an optional donation with no pressure.", "result": "The developer may support your next project.", "law": "A voluntary donation request does not change the existing licence.", "ethics": "Be clear that payment is optional, not a hidden obligation.", "t": 10, "b": 5}]}], "abuser": [{"title": "The perfect stolen sprite", "tag": "01 / THE ASSET HUNT", "story": "You are Glitch, a developer chasing a viral launch. You find a perfect sprite sheet in someone else\u2019s game.", "evidence": "It is protected artwork. There is no reuse licence or permission, and no relevant exception in this scenario.", "choices": [{"label": "Rip it and credit the artist.", "result": "You gain instant polish, but the artist objects.", "law": "Credit does not replace permission. Copying can infringe even when you name the creator.", "ethics": "Recognition is good; taking control of someone else\u2019s work is not.", "t": -20, "b": 25}, {"label": "Make your own sprite inspired by the genre.", "result": "Your launch takes longer, but the hero is yours.", "law": "Copyright protects expression, not a broad genre idea. Avoid copying distinctive art or code.", "ethics": "Inspiration becomes creative work when you develop your own expression.", "t": 15, "b": 5}, {"label": "Ask for a licence and wait before using it.", "result": "You start a conversation with the artist.", "law": "Permission must cover your intended use. Silence is not consent.", "ethics": "Give the creator a real choice and respect their answer.", "t": 15, "b": 0}]}, {"title": "Five seconds of fame", "tag": "02 / THE TRAILER", "story": "Your trailer needs a famous song. A friend says five seconds is always safe.", "evidence": "This is a promotional trailer, not criticism, quotation for a justified purpose, or parody. You have no music permissions.", "choices": [{"label": "Use five seconds. Add \u201cno infringement intended\u201d.", "result": "The trailer grabs attention, but the music use is challenged.", "law": "There is no universal safe number of seconds. A disclaimer does not grant permission.", "ethics": "A catchy shortcut shifts the cost to another creator.", "t": -20, "b": 25}, {"label": "Use a track licensed for this trailer.", "result": "Your trailer launches with permission in place.", "law": "Check that the licence covers synchronisation, the recording and intended distribution.", "ethics": "Respect the musician and keep the licence record.", "t": 15, "b": 10}, {"label": "Hum a recognisable version yourself.", "result": "You own the new recording, but not the song.", "law": "Recording it yourself does not automatically clear rights in the underlying composition.", "ethics": "Changing the performer is not the same as obtaining permission.", "t": -10, "b": 10}]}, {"title": "Licence loot", "tag": "03 / THE REMIX LAB", "story": "You find a CC BY-NC-ND 4.0 illustration. You want to alter it and sell it as a game skin.", "evidence": "NC restricts commercial use. ND does not permit sharing adaptations under this licence.", "choices": [{"label": "Sell a recoloured version with attribution.", "result": "Credit is present, but the reuse is outside the licence.", "law": "Attribution alone does not satisfy NC and ND restrictions. Separate permission could authorise it.", "ethics": "Treat licence conditions as a promise, not an obstacle to hide.", "t": -20, "b": 25}, {"label": "Get separate permission for the paid remix.", "result": "You negotiate an authorised collaboration.", "law": "The rights holder can give additional permission beyond the public licence.", "ethics": "A fair agreement lets both creators benefit.", "t": 15, "b": 10}, {"label": "Find an alternative that permits commercial adaptations.", "result": "You change the design and keep a licence record.", "law": "Check all conditions: BY needs attribution; SA requires qualifying shared adaptations to use the same or a compatible licence.", "ethics": "Choose assets that fit your plan rather than bending their terms.", "t": 15, "b": 5}]}, {"title": "It\u2019s for school!", "tag": "04 / THE CLASSROOM", "story": "Your team wants to upload a full commercial game soundtrack publicly as part of a class project.", "evidence": "The upload gives anyone the entire album. You have no permission. The lesson only needs discussion of one musical feature.", "choices": [{"label": "Upload it: education makes everything exempt.", "result": "The public upload replaces access to the album.", "law": "Teaching is not blanket permission. A whole public album is not justified merely by calling it schoolwork.", "ethics": "Your learning goal does not erase the musician\u2019s interests.", "t": -20, "b": 20}, {"label": "Link to the authorised stream and analyse it.", "result": "Classmates hear the music at its authorised source.", "law": "Linking to an authorised source avoids making this new public copy.", "ethics": "Support access through a legitimate source and add your own analysis.", "t": 15, "b": 5}, {"label": "Use only a necessary, credited excerpt after checking the exception.", "result": "You narrow the use to the teaching point.", "law": "UK illustration for instruction requires non-commercial purpose, fair dealing and sufficient acknowledgement, unless impracticable. Context still matters.", "ethics": "Use no more than your learning purpose needs.", "t": 10, "b": 5}]}, {"title": "Legal asset. Dishonest pitch.", "tag": "05 / THE PITCH", "story": "You use a properly verified CC0 asset with no other rights issues. Your pitch says you hand-painted every asset.", "evidence": "Copyright reuse is permitted. The claim about your own work is false.", "choices": [{"label": "Keep the claim: the licence allows reuse.", "result": "Your pitch impresses people until the truth emerges.", "law": "On these facts copyright reuse is allowed. That does not make the claim honest; other rules may apply.", "ethics": "Permitted copying can still be plagiarism or misrepresentation.", "t": -20, "b": 25}, {"label": "Say which assets you made and which you reused.", "result": "Your audience sees your real contribution.", "law": "CC0 does not generally require attribution as a copyright condition.", "ethics": "Honesty and giving useful credit can go beyond legal minimums.", "t": 15, "b": 5}, {"label": "Replace the assets with your own before making that claim.", "result": "More work, but the pitch now matches reality.", "law": "Your original assets avoid reliance on someone else\u2019s copyright permission.", "ethics": "Only claim the contribution you actually made.", "t": 15, "b": 0}]}, {"title": "The call-out", "tag": "06 / THE REPAIR", "story": "An artist contacts you about an unlicensed image in your older game build. You confirm they are right.", "evidence": "You can remove it now. Deleting the file will not change what happened earlier.", "choices": [{"label": "Remove it, apologise and discuss a fair resolution.", "result": "You stop the misuse and begin rebuilding trust.", "law": "Removal can prevent continued misuse; it does not automatically erase liability for past use.", "ethics": "Repair includes acknowledgement, changed behaviour and listening to the person harmed.", "t": 15, "b": 0}, {"label": "Delete it and claim it was never there.", "result": "The artist has screenshots. Trust collapses.", "law": "Deleting evidence does not make past copying authorised.", "ethics": "A cover-up adds dishonesty to the original harm.", "t": -25, "b": 5}, {"label": "Offer \u201cexposure\u201d instead of addressing permission.", "result": "The artist refuses your substitute payment.", "law": "Exposure is not a licence or a defence to unauthorised copying.", "ethics": "Creators should choose how their work is used and rewarded.", "t": -15, "b": 15}]}]};
const quiz=[{"q": "A credited image is automatically free to use.", "a": false, "why": "Credit and permission are different. You need a suitable licence, permission, public-domain status or an applicable exception."}, {"q": "A copyright holder can always block a negative review that uses a clip.", "a": false, "why": "Fair dealing for criticism or review may apply. Check the purpose, fairness and acknowledgement."}, {"q": "Something can be allowed by copyright and still be unethical.", "a": true, "why": "Honesty, consent, fairness and harm matter beyond copyright permission."}];
const imageChallenges=[{icon:'🧙',asset:'Character sprite sheet',source:'Found on a fan wiki — no licence stated anywhere',use:'Ship it in your commercial mobile game',answer:'ask',why:'No licence statement means ordinary copyright still applies by default. Message the artist and get written permission — or a proper licence — before you ship.'},{icon:'🎨',asset:'UI icon pack',source:'Licensed CC BY-NC 4.0',use:'Bundle it into a premium app you plan to sell',answer:'no',why:'NC means non-commercial uses only. Attribution can’t override that condition — you’d need a separate commercial licence from the creator, or a different pack.'},{icon:'🧊',asset:'3D character model',source:'Licensed CC BY 4.0 on an asset marketplace',use:'Modify it and ship it in your paid VR game, credited in the end titles',answer:'yes',why:'BY only requires appropriate credit and noting your changes. Commercial use is allowed unless the licence also says NC.'},{icon:'🎨',asset:'Icon pack derivative',source:'Original icons licensed CC BY-SA 4.0',use:'Sell your recoloured version under an “all rights reserved, no reuse” licence',answer:'no',why:'ShareAlike requires a qualifying adaptation to carry the same or a compatible licence. Locking it down as all-rights-reserved breaks that condition, whatever credit you give.'},{icon:'📸',asset:'Candid photo of a teammate',source:'You took it yourself at a game jam',use:'Feature it in the studio’s official marketing, without asking them first',answer:'ask',why:'Owning the copyright in a photo you took doesn’t settle privacy or consent. Ask the person before using their image to promote the studio.'},{icon:'🛒',asset:'Stock character illustration',source:'Purchased under a standard licence covering one commercial project',use:'Reuse the same file across three separate paid games without buying more licences',answer:'ask',why:'Standard stock licences are usually scoped to a single project or print run. Check the terms and buy an extended or multi-project licence before reusing it.'},{icon:'🎬',asset:'3-second gameplay screenshot',source:'Captured from a AAA game you’re reviewing',use:'Use it, credited, in a critical article about the game’s difficulty balance',answer:'yes',why:'UK fair dealing for criticism or review can cover a short, credited, relevant image used to support genuine critique. Purpose, amount and context all matter.'},{icon:'🖼️',asset:'Seamless rock texture',source:'You released it yourself under CC BY 4.0 last year',use:'A commercial game now uses it, fully compliant with your licence — you wish you’d charged',answer:'yes',why:'CC BY permits commercial reuse, and you can’t revoke a licence from someone already complying with it. You can still charge for anything you release from now on.'},{icon:'👾',asset:'Fan render of a rival studio’s mascot',source:'AI-generated image styled closely on that mascot’s copyrighted design',use:'Use it in your own game’s marketing to draw in their fans',answer:'no',why:'A close copy of someone’s distinctive character design is still their expression, however it was produced — and trading on a recognisable mascot can also raise trade mark issues, separate from copyright.'}];
const Phase=Object.freeze({MENU:'menu',CHOICE:'choice',RESULT:'result',QUIZ:'quiz',QUIZRESULT:'quizresult',END:'end'});
let state={phase:Phase.MENU};const app=document.querySelector('#app');
const names={holder:'Nova · Copyright holder',abuser:'Glitch · Copyright abuser'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function paint(html){app.innerHTML=html;app.classList.remove('in');void app.offsetWidth;app.classList.add('in');app.focus();window.scrollTo(0,0)}
function home(){state={phase:Phase.MENU};paint(`<div class="hero"><div><div class="eyebrow">A studio-life sim for games design students</div><h1>Make a move.<br><em>Own the fallout.</em></h1><p class="intro muted">One indie studio, two career paths. Every mission is a real brief a games designer meets on the job — asset rights, licences, credit, deadlines. Protect your work, chase the hype, or cross the line.</p><p class="small">6 missions → consequences → a final myth-busting round. You also start each run with 3 <b>Risk Tokens</b> — spend one to gamble a choice's outcome for a bigger reward, or bank steady points instead. Play solo or debate each choice with a partner.</p></div><div class="sticker" aria-hidden="true"><strong>© !</strong><span>CAN YOU<br>USE IT?</span></div></div><div class="roles"><section class="role"><div class="avatar" aria-hidden="true">✦</div><div class="eyebrow">Create · Protect · Negotiate</div><h3>The copyright holder</h3><p>Play as Nova, an indie game artist. Defend your art, choose how to share it, and discover where your control ends.</p><button class="primary" onclick="start('holder')">Play as Nova →</button></section><section class="role"><div class="avatar" aria-hidden="true">ϟ</div><div class="eyebrow" style="color:var(--pink)">Copy · Remix · Face the consequences</div><h3>The copyright abuser</h3><p>Play as Glitch, a developer chasing a viral launch. Shortcuts promise instant hype. Take the risk or change course before your reputation crashes.</p><button class="pink" onclick="start('abuser')">Play as Glitch →</button></section></div><p class="small">Your mission: finish with at least 70 trust and bust all three final myths. Buzz is tempting, but it cannot buy trust. Let trust hit 0 and your studio reputation collapses — game over. You can always recover from a bad choice, but not from a ruined one.</p>`)}
function start(role){state={phase:Phase.CHOICE,role,index:0,trust:50,minTrust:50,buzz:0,log:[],q:0,correct:0,riskTokens:3,gambleWins:0,gambleLosses:0,gambledThisMission:false,streak:0,bestStreak:0,badges:[]};renderMission()}
function award(id,label){if(!state.badges.some(b=>b.id===id)){state.badges.push({id,label})}}
function badgeStrip(){return state.badges.length?`<div class="small" style="margin-top:10px">🏅 ${state.badges.map(b=>`<span class="tag">${esc(b.label)}</span>`).join(' ')}</div>`:''}
function hud(){return `<div class="hud"><div><span class="eyebrow">${names[state.role]}</span><div class="small">Mission ${state.index+1} of 6</div></div><div class="stats"><div class="stat">Trust <strong id="statTrust">${state.trust}</strong>/100</div><div class="stat">Buzz <strong id="statBuzz">${state.buzz}</strong></div><div class="stat">Risk <strong id="statRisk">${'🎲'.repeat(state.riskTokens)||'—'}</strong></div></div></div><div class="route" aria-label="Mission ${state.index+1} of 6">${missions[state.role].map((_,i)=>`<div class="dot ${i<=state.index?'done':''}"></div>`).join('')}</div>${badgeStrip()}`}
function renderMission(){state.gambledThisMission=false;let m=missions[state.role][state.index];paint(hud()+`<div class="board"><section class="card"><div class="eyebrow">${m.tag}</div><h2>${m.title}</h2><p>${m.story}</p><div class="evidence"><b>Evidence on the table</b><br>${m.evidence}</div><div id="decision"><h3>Your move?</h3><div class="choices">${m.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><span class="key">${i+1}</span>${c.label}</button>`).join('')}</div></div></section><aside><div class="eyebrow">Think before you click</div><h3 style="margin-top:15px">Two different boundaries.</h3><p><b>Copyright:</b> Who owns it? What permission or exception applies?</p><p><b>Ethics:</b> Is it honest, fair and respectful? Who might be harmed?</p><p><b>🎲 Risk tokens:</b> after you see a result, you can spend one to gamble it for a bigger swing. Fail trust checks too often and the studio folds — spend tokens wisely.</p><button onclick="openGuide()">Consult field guide ↗</button><p class="small">Use Tab + Enter, or keys 1–3 to choose. No time pressure.</p><button onclick="restartPrompt()">Restart run</button></aside></div>`)}
function choose(i){if(state.phase!==Phase.CHOICE)return;const m=missions[state.role][state.index],c=m.choices[i];if(!c)return;state.phase=Phase.RESULT;state.trust=Math.max(0,Math.min(100,state.trust+c.t));state.buzz=Math.max(0,state.buzz+c.b);state.minTrust=Math.min(state.minTrust,state.trust);if(c.t>0){state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak)}else{state.streak=0}state.log.push({title:m.title,...c});renderMission();state.phase=Phase.RESULT;document.querySelector('#decision').innerHTML=`<div class="feedback" role="status"><div class="eyebrow">You chose: ${c.label}</div><h3 style="margin-top:15px">${c.result}</h3><p class="deltas">Trust ${c.t>=0?'+':''}${c.t} · Buzz ${c.b>=0?'+':''}${c.b}</p><div class="boundary"><b>COPYRIGHT BOUNDARY</b>${c.law}</div><div class="boundary ethics"><b>ETHICAL BOUNDARY</b>${c.ethics}</div><div id="gambleZone">${gambleOffer()}</div><button class="primary" onclick="next()">${state.trust<=0?'See the outcome':state.index===5?'Enter the final showdown':'Next mission'} →</button></div>`;document.querySelector('#decision button').focus()}
function gambleOffer(){if(state.gambledThisMission||state.riskTokens<=0||state.trust<=0)return'';const odds=Math.min(80,Math.max(30,45+Math.round(state.trust/4)));return `<div class="boundary" style="border-left:3px solid var(--lime)"><b>PUSH YOUR LUCK</b><p class="small" style="margin:4px 0 10px">Spend 1 of ${state.riskTokens} risk tokens to gamble this result for a bigger swing. Estimated odds: ${odds}% (higher trust improves your odds).</p><button class="pink" onclick="pushLuck(${odds})">🎲 Gamble it →</button></div>`}
function pushLuck(odds){if(state.gambledThisMission||state.riskTokens<=0)return;state.gambledThisMission=true;state.riskTokens--;award('risk-taker','Risk taker');const win=Math.random()*100<odds;let msg;if(win){const tGain=12,bGain=18;state.trust=Math.max(0,Math.min(100,state.trust+tGain));state.buzz+=bGain;state.minTrust=Math.min(state.minTrust,state.trust);state.gambleWins++;if(state.gambleWins>=3)award('high-roller','High roller');msg=`<b style="color:var(--lime)">It paid off.</b><p class="small">Your gamble lands. Trust +${tGain} · Buzz +${bGain}.</p>`}else{const tLoss=18;state.trust=Math.max(0,state.trust-tLoss);state.minTrust=Math.min(state.minTrust,state.trust);state.gambleLosses++;award('bold-and-bruised','Bold — and bruised');msg=`<b style="color:var(--pink)">It backfires.</b><p class="small">The risk doesn't land. Trust −${tLoss}.</p>`}document.querySelector('#gambleZone').innerHTML=`<div class="boundary ethics">${msg}</div>`;document.querySelector('#statTrust').textContent=state.trust;document.querySelector('#statBuzz').textContent=state.buzz;document.querySelector('#statRisk').textContent='🎲'.repeat(state.riskTokens)||'—';if(state.trust<=0){document.querySelector('#decision button.primary').textContent='See the outcome →'}}
function next(){if(state.phase!==Phase.RESULT)return;if(state.trust<=0){state.phase=Phase.END;collapse();return}if(state.index<5){state.index++;state.phase=Phase.CHOICE;renderMission()}else{state.phase=Phase.QUIZ;renderQuiz()}}
function collapse(){paint(`<div class="eyebrow">Run over · ${names[state.role]}</div><h2 style="color:var(--pink)">Reputation collapse</h2><p class="intro muted">Trust hit zero. In a real studio this is the point clients stop replying and colleagues stop vouching for you — the run ends here rather than pretending it doesn't matter.</p><div class="card"><div class="stats"><div><div class="score" style="color:var(--pink)">0</div>Trust / 100</div><div><div class="score">${state.buzz}</div>Buzz</div><div><div class="score">${state.index+1}/6</div>Missions reached</div></div><p class="small">Rank: <b>F — Career reset.</b> You spent ${3-state.riskTokens}/3 risk tokens (${state.gambleWins} paid off, ${state.gambleLosses} backfired). This is a teaching score, not a legal verdict.</p></div>${badgeStrip()}<div class="actions"><button class="primary" onclick="start('${state.role}')">Retry this role →</button><button onclick="start('${state.role==='holder'?'abuser':'holder'}')">Try the other side</button><button onclick="home()">Main menu</button></div><h3 style="margin-top:35px">What went wrong</h3>${state.log.map(x=>`<div class="log"><b>${x.title}</b><p>You chose: ${x.label}</p><p class="muted">${x.law}</p></div>`).join('')}<h3 style="margin-top:30px">Exit ticket</h3><p>1. Which single choice cost you the most trust, and what would you do differently?<br>2. Did a risk-token gamble help or hurt this run?<br>3. Name one permission or licence check that would have avoided the worst moment above.</p>`)}
function renderQuiz(){let q=quiz[state.q];paint(`<section class="card"><div class="eyebrow">Final showdown · Myth ${state.q+1} / 3</div><h2>Fact or fiction?</h2><p class="intro">“${q.q}”</p><div id="quizAnswer" class="actions"><button class="primary" onclick="answer(true)">True</button><button class="pink" onclick="answer(false)">False</button></div><p class="small">The final challenge tests what you know, regardless of the risks you took.</p></section>`)}
function answer(a){if(state.phase!==Phase.QUIZ)return;state.phase=Phase.QUIZRESULT;let q=quiz[state.q],ok=a===q.a;if(ok)state.correct++;document.querySelector('#quizAnswer').innerHTML=`<div role="status"><h3>${ok?'Myth busted!':'Plot twist — try this rule.'}</h3><p>${q.why}</p><button class="primary" onclick="nextQuiz()">${state.q===2?'Reveal your ending':'Next myth'} →</button></div>`;document.querySelector('#quizAnswer button').focus()}
function nextQuiz(){if(state.phase!==Phase.QUIZRESULT)return;if(state.q<2){state.q++;state.phase=Phase.QUIZ;renderQuiz()}else{state.phase=Phase.END;end()}}
function end(){let win=state.trust>=70&&state.correct===3;let title=win?'Creative champion':state.trust>=70?'Trusted creator in training':state.buzz>=60?'Viral… at a cost':'A comeback in the making';if(state.riskTokens===3)award('steady-hand','Steady hand — never gambled');if(state.correct===3)award('myth-buster','Myth buster');if(state.minTrust<=20&&state.trust>=70)award('comeback-kid','Comeback kid');if(win)award('creative-champion','Creative champion');if(state.bestStreak>=4)award('on-a-roll','On a roll (4+ good calls running)');let score=state.trust+state.correct*10+(state.gambleWins-state.gambleLosses)*3;let rank=score>=95?'S':score>=80?'A':score>=65?'B':score>=45?'C':'D';paint(`<div class="eyebrow">Run complete · ${names[state.role]}</div><h2>${title}</h2><p class="intro muted">${win?'You balanced creative freedom with responsibility. Now try seeing the same world from the other side.':'Your choices have consequences — but your next run can change the story. Review the boundaries below and try the other side.'}</p><div class="card"><div class="stats"><div><div class="score">${rank}</div>Studio rank</div><div><div class="score">${state.trust}</div>Trust / 100</div><div><div class="score">${state.buzz}</div>Buzz</div><div><div class="score">${state.correct}/3</div>Myths busted</div></div><p class="small">Success target: 70+ trust and 3/3 myths. Risk tokens spent: ${3-state.riskTokens}/3 (${state.gambleWins} paid off, ${state.gambleLosses} backfired). Trust is a teaching score, not a legal verdict. High buzz does not excuse harm.</p>${badgeStrip()}</div><div class="actions"><button class="primary" onclick="start('${state.role==='holder'?'abuser':'holder'}')">Switch sides →</button><button onclick="start('${state.role}')">Retry this role</button><button onclick="window.print()">Print reflection</button><button onclick="home()">Main menu</button></div><h3 style="margin-top:35px">Your decision trail</h3>${state.log.map(x=>`<div class="log"><b>${x.title}</b><p>You chose: ${x.label}</p><p class="muted">${x.law}</p><p class="muted">Ethics: ${x.ethics}</p></div>`).join('')}<h3 style="margin-top:30px">Exit ticket</h3><p>1. Which choice was permitted by copyright but still ethically questionable?<br>2. What would you change if you played the other role?<br>3. Name one permission or licence condition you would check before publishing a game.</p>`)}
function panel(html){document.querySelector('#modalBody').innerHTML=html;document.querySelector('#modal').showModal()}
function restartPrompt(){panel(`<h2>Start again?</h2><p>This clears your current run.</p><button class="primary" onclick="document.querySelector('#modal').close();home()">Return to role selection</button>`)}

function openGallery(){state={phase:'IMG',i:0,score:0,streak:0,bestStreak:0,badges:[]};renderImgRound()}
function imgHud(){return `<div class="hud"><div><span class="eyebrow">Image challenge</span><div class="small">Round ${state.i+1} of ${imageChallenges.length+1}</div></div><div class="stats"><div class="stat">Score <strong>${state.score}</strong>/${imageChallenges.length+1}</div><div class="stat">Streak <strong>${state.streak}</strong></div></div></div><div class="route" aria-label="Round ${state.i+1} of ${imageChallenges.length+1}">${Array.from({length:imageChallenges.length+1}).map((_,i)=>`<div class="dot ${i<=state.i?'done':''}"></div>`).join('')}</div>`}
function renderImgRound(){state.answered=false;if(state.i===0){paint(imgHud()+`<section class="card"><div class="eyebrow">Round 1 · Real images, real rights</div><h2>Same website. Different rules.</h2><p>Both images appear on Wikimedia Commons, the media library used by Wikipedia. Can you use them in a game you sell?</p><div class="gallery"><figure><img src="${galleryImages.painting}" alt="The Starry Night: swirling blue sky, bright stars and a village beneath"><figcaption><b>A · The Starry Night (1889)</b><br>Vincent van Gogh · Google Art Project reproduction<br><span class="tag">Public-domain artwork</span><p>The painting’s copyright has expired. Commons identifies this faithful reproduction as public domain. Check the file’s reuse notes for your country.</p><a href="https://commons.wikimedia.org/wiki/File:Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg" target="_blank" rel="noopener">View source ↗</a></figcaption></figure><figure><img src="${galleryImages.mountain}" alt="Panoramic view from Fronalpstock across a lake and mountains in Switzerland"><figcaption><b>B · Fronalpstock</b><br>© Hannes Röst · Wikimedia Commons<br><span class="tag">Copyrighted · CC BY-SA 3.0</span><p>Commercial reuse is allowed under the licence. Credit the creator and link the licence. Shared adaptations must follow its ShareAlike terms.</p><a href="https://commons.wikimedia.org/wiki/File:Fronalpstock_big.jpg" target="_blank" rel="noopener">View source ↗</a></figcaption></figure></div><h3>Which can go in a paid game?</h3><div id="imgAnswer" class="choices"><button class="choice" onclick="answerImg(0)"><span class="key">1</span>Only A — copyrighted always means forbidden.</button><button class="choice" onclick="answerImg(1)"><span class="key">2</span>Both — but B has licence conditions.</button><button class="choice" onclick="answerImg(2)"><span class="key">3</span>Both — anything on Wikipedia has no restrictions.</button></div></section>`);return}
let q=imageChallenges[state.i-1];paint(imgHud()+`<section class="card"><div class="eyebrow">Round ${state.i+1} · ${esc(q.asset)}</div><div class="imgIcon" aria-hidden="true">${q.icon}</div><p><b>Source:</b> ${esc(q.source)}</p><p><b>You want to:</b> ${esc(q.use)}</p><h3 style="margin-top:20px">Can you use it?</h3><div id="imgAnswer" class="choices"><button class="choice" onclick="answerImg('yes')"><span class="key">1</span>Yes — go ahead</button><button class="choice" onclick="answerImg('no')"><span class="key">2</span>No — this breaches the terms</button><button class="choice" onclick="answerImg('ask')"><span class="key">3</span>Stop and ask first</button></div></section>`)}
function answerImg(a){if(state.phase!=='IMG'||state.answered)return;state.answered=true;let ok,why;if(state.i===0){ok=a===1;why='A is a public-domain artwork. B remains copyrighted, but its CC BY-SA licence permits commercial reuse when you comply with its terms. Public domain and openly licensed are different — and neither becomes your own creation, so claiming you painted or photographed either would still be dishonest.'}else{let q=imageChallenges[state.i-1];ok=a===q.answer;why=q.why}if(ok){state.score++;state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);if(state.streak===3)award('licence-eye','Sharp licence eye')}else{state.streak=0}document.querySelector('#imgAnswer').innerHTML=`<div class="feedback" role="status"><h3 style="color:${ok?'var(--lime)':'var(--pink)'}">${ok?'Correct call.':'Not quite.'}</h3><p>${why}</p><button class="primary" onclick="nextImgRound()">${state.i===imageChallenges.length?'See results':'Next image'} →</button></div>`;document.querySelector('#imgAnswer button.primary').focus()}
function nextImgRound(){if(state.i<imageChallenges.length){state.i++;renderImgRound()}else{endImgChallenge()}}
function endImgChallenge(){state.phase='IMGEND';let total=imageChallenges.length+1;let pct=Math.round(100*state.score/total);if(pct===100)award('licence-detective','Licence detective');let title=pct===100?'Licence detective':pct>=70?'Sharp eye':pct>=40?'Getting there':'Back to the field guide';paint(`<div class="eyebrow">Image challenge complete</div><h2>${title}</h2><div class="card"><div class="stats"><div><div class="score">${state.score}/${total}</div>Correct calls</div><div><div class="score">${state.bestStreak}</div>Best streak</div></div><p class="small">This round covers the licence types you’ll meet constantly in production: public domain, CC BY / BY-NC / BY-SA, missing licences, stock-licence scope, fair dealing and image subjects’ consent.</p>${badgeStrip()}</div><div class="actions"><button class="primary" onclick="openGallery()">Play again →</button><button onclick="openGuide()">Field guide ↗</button><button onclick="home()">Main menu</button></div>`)}

function openGuide(){panel(`<div class="eyebrow">Open at any time · No penalty</div><h2>The field guide</h2><button onclick="document.querySelector('#modal').close();openGallery()">Try the real-image challenge →</button><details open><summary>Permission is the starting question</summary><p>Identify the work and rights holder. Check whether your intended use is covered by permission, a licence, expired copyright or a legal exception. Keep evidence of the terms. Being online does not make something free.</p></details><details><summary>Credit ≠ permission</summary><p>Naming the creator is often required and usually good practice. It does not, on its own, authorise copying. “No infringement intended” changes nothing.</p></details><details><summary>UK fair dealing, not a universal free pass</summary><p>Some uses, including criticism, review, quotation, parody and teaching, may qualify for exceptions. Each has conditions. Fairness depends on context; there is no universal safe percentage or number of seconds. A court may ultimately decide disputed cases.</p></details><details><summary>Read the licence letters</summary><p><b>BY:</b> give appropriate credit, link the licence, and indicate changes. <b>NC:</b> non-commercial uses only. <b>ND:</b> do not share adaptations under that licence. <b>SA:</b> shared adaptations use the same or a compatible licence. Check the exact licence and version. CC0 generally removes copyright conditions, but other rights may still exist.</p></details><details><summary>Ownership has limits</summary><p>Qualifying works receive UK copyright automatically. A licence gives permission; an assignment transfers ownership. Commissioning a freelancer does not automatically transfer copyright. Employees’ work created in the course of employment is normally owned first by the employer, subject to agreement.</p></details><details><summary>Ethics asks a different question</summary><p>Even if copyright permits a use, ask: am I honest about my contribution? Is anyone exposed or humiliated? Is consent meaningful? Is my response proportionate? A legal permission does not settle every ethical issue.</p></details><h3 style="margin-top:22px">Check the sources</h3><p class="small">UK classroom summary, checked 25 September 2026. Follow these links for the full conditions; the game is not legal advice.</p><p><a href="https://www.gov.uk/copyright" target="_blank" rel="noopener">GOV.UK: copyright basics</a><br><a href="https://www.gov.uk/guidance/exceptions-to-copyright" target="_blank" rel="noopener">GOV.UK: copyright exceptions</a><br><a href="https://www.gov.uk/guidance/ownership-of-copyright-works" target="_blank" rel="noopener">GOV.UK: ownership</a><br><a href="https://creativecommons.org/share-your-work/use-remix/cc-licenses/" target="_blank" rel="noopener">Creative Commons: licence conditions</a><br><a href="https://creativecommons.org/faq/" target="_blank" rel="noopener">Creative Commons: common questions</a></p>`)}
function openTeacher(){panel(`<div class="eyebrow">Classroom mode · Games design & development courses</div><h2>Turn choices into discussion.</h2><p><b>Learning goals:</b> distinguish copyright from ethics; recognise permission and licence limits; apply UK exceptions carefully; explain proportionate responses and repair.</p><p><b>20–30 minute activity:</b> 2 minutes to introduce ownership and permission; 10 minutes playing in pairs; 8 minutes switching sides or comparing with another pair; 5 minutes for the exit ticket.</p><p><b>Pair roles:</b> one student decides, the other challenges the evidence. Swap after mission 3. On a projector, let the class vote before revealing an outcome.</p><p><b>Scoring:</b> trust starts at 50 and stays within 0–100. Buzz starts at 0. Shortcuts can create buzz, but success requires 70+ trust and all 3 final answers. Each run also gets 3 risk tokens: spending one gambles the current result for a bigger swing, with odds tied to current trust. Losing all trust ends the run early as a "reputation collapse" — a deliberate failure state so risk has real weight, not just a lower score. Every player still reaches a debrief; mistakes are opportunities to learn. Ethical scores are discussion prompts, not objective measures of morality.</p><p><b>Discussion:</b> Where in real studio work does a "risk token" moment show up — rushing a release, using a placeholder asset under deadline pressure, shipping without checking a licence? Is refusing permission unethical? When is an enforcement response disproportionate? Can attribution be ethically valuable even when not required? What facts would change your decision?</p><p><b>Answer key:</b> final myths are False, False, True. Each mission explains its choices immediately. Multiple choices can be defensible; have students justify trade-offs rather than guess one approved attitude.</p><p><b>Link to your lesson:</b> the supplied RPG lesson informed the copyright and ethics themes. Its embedded student tasks are not requirements for this game. Its US fair-use framing has been replaced with UK fair-dealing guidance. Optional coding extension: map Menu → Choice → Result → Quiz → End, then describe how an enum prevents invalid states.</p><p><b>Access:</b> mouse, touch or keyboard; no timer, audio requirement or account. Press Escape to close panels. This file works offline; source links need internet. No student responses are stored after closing or refreshing.</p>`)}
